version: "0.2"
studies:
  - id: RES-001
    status: superseded
    problem: 客户现有 ENTOAM 映拓 Qy-C126 电子秤和 Q1S 收款机是否能被外部软件实时读取重量
    related_business_logic:
      - BL-DEVICE-001
      - BL-WEIGH-003
    related_tasks: []
    constraints:
      - 未找到 Qy-C126 官方产品手册
      - 未拿到设备实物接口照片
      - 未拿到制造商协议文档
      - Q1S 主板 Gm-J6412D16-V2E 未找到公开规格
    candidates:
      - "串口/COM 实时读取：映拓计价秤公开文档默认 COM2，映拓主动通讯协议；同系列 QY-A126 第三方抓包成功"
      - "USB 转串口读取：若设备只暴露专用端口或隐藏串口，则需要现场确认转接方式"
      - "换支持连接的新电子秤：若本机无数据口或协议不开放，作为备选"
    strategy: spike-first
    recommendation: 现阶段按“疑似支持串口实时取重”继续澄清，但必须在实物上确认数据端口、COM 号、协议版本和固件是否启用主动通讯协议后，才能作为系统自动取重的接口依据。
    decision_ref: DEC-023
    conditions:
      - 客户拍摄电子秤和收款机背面/侧面端口照片
      - 在 Q1S 设备管理器中确认 COM 端口
      - 联系映拓/巨隆厂商索要 Qy-C126 主动通讯协议和上位机工具
    contrary_evidence:
      - Qy-C126 未出现在公开支持型号列表中
      - 主板型号 Gm-J6412D16-V2E 无公开规格页面
    confidence: 0.55
    sources:
      - "https://tddoc.td365.com.cn/docs/tdgj/yingt"
      - "https://tddoc.td365.com.cn/docs/tdgj/cpzcxh"
      - "https://help-jsh.paidui.com/008c/e14f"
      - "https://www.cnblogs.com/minuhy/p/20078724"
