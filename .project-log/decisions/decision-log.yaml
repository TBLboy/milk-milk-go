    context: 重量正确是第一版防错核心，需要确定允差是全局统一、按辅料/配方配置，还是完全不允许偏差。
    hypothesis: 按辅料或配方配置允差，并把参数放到设置界面，可以在现场不同重量辅料之间保持可操作性，同时避免为每次调整改代码。
    options:
