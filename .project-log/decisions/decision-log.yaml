    context: 第一版已确认以公司自制二维码为主，但标签由谁打印、打印时录入什么、每次打印是否独立编号、粘贴后是否复核尚未确认。
    hypothesis: 由电脑后台管理员统一生成和打印标签，配合粘贴后扫码复核，可以同时满足标签可控和降低贴错风险。
    options:
