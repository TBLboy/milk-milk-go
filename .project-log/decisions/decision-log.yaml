version: "0.2"
decisions:
  - id: DEC-023
    title: 第一版不连接电子秤，称重结果以手动输入为主
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-WEIGH-003
      - BL-WEIGH-006
    context: 用户目前不在公司现场，无法确认和验证电子秤数据接口；若第一版强依赖电子秤，会因硬件无法验证而阻塞交付。
    hypothesis: 将重量输入做成“手动输入并标记来源”的方式，可以快速形成可运行测试版；后续接入电子秤时不需要推翻称重记录模型。
    options:
      - name: 第一版不接电子秤，手动输入
        benefits:
          - 不依赖现场硬件确认
          - 可先开发测试版
          - 主流程不会被硬件阻塞
        costs:
          - 重量准确度依赖操作员输入
        risks:
          - 手动输入可能造成误差，需要记录操作员、时间并标记手动来源
      - name: 第一版直接接电子秤
        benefits:
          - 重量自动读取更准确
        costs:
          - 需要现场设备、串口和协议验证
        risks:
          - 当前不在现场，硬件不确定性会阻塞交付
      - name: 只开发串口代码但不验证
        benefits:
          - 保留自动取重代码框架
        costs:
          - 没有真实协议验证，测试版无法证明可用
        risks:
          - 假实现可能被误认为已完成硬件能力
    decision: 第一版不集成电子秤，称重结果由操作员在平板手动输入并标记为 manual；保留后续电子秤适配的扩展空间，但不纳入第一版实现范围。
    reason_summary:
      - 用户明确第一版暂时不考虑连接电子秤
      - 用户不在现场，无法完成硬件验证
      - 手动输入可保证测试版闭环，后续接入不需要改变记录模型
    conditions:
      - 第一版称重记录必须标记数据来源为 manual
      - 后续版本再研究电子秤接口、协议和是否需要更换新秤
    action: 更新 Q-004、REQ-001、BL-WEIGH-003、BL-WEIGH-006 和 RES-001/RES-002
    expected_result: 第一版基线明确不接电子秤，重量输入以手动为主
    reversal_plan: 后续现场确认电子秤可连接后，新增自动读秤通道，不影响已保存记录
    observation: 用户答复第一版本暂时不考虑连接电子秤
    actual_result: 第一版范围已改为不接电子秤，称重用手动输入标记 manual
    outcome_status: successful
    lesson: 硬件能力应依据可验证性决定范围，不应把未验证的最终目标直接放进第一版基线。
    evidence:
      - user-statement/2026-09-09 第一版不连接电子秤
      - .project-log/business-logic/open-questions.yaml#Q-004
    supersedes: []
    created_at: "2026-09-09T06:00:00Z"
    updated_at: "2026-09-09T06:00:00Z"
  - id: DEC-025
    title: 第一版部署方式优先采用 Windows 安装包和后台服务
    category: technical
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DEVICE-002
      - BL-DATA-002
    context: 用户询问电脑端软件更适合 Docker 容器还是开发成安装包直接安装在电脑上，并关注后期更新维护。
    hypothesis: 第一版是单机局域网系统，用户现场可能没有 Docker 环境，且未来打印/电子秤需要访问 Windows 本机设备；安装包加后台服务比 Docker 更适合现场启动、关机和升级。
    options:
      - name: Windows 安装包 + 后台服务
        benefits:
          - 安装和卸载直观
          - 开机自启动容易
          - 数据和配置留在本机
          - 更新包可直接拷贝安装
          - 打印机/串口设备访问简单
        costs:
          - 打包安装器和服务注册需要投入一点开发工作
        risks:
          - 不同 Windows 版本需要测试
      - name: Docker 容器
        benefits:
          - 运行环境高度一致
          - 多机或云端迁移更统一
        costs:
          - 现场需要安装 Docker Desktop/WSL
          - 离线镜像搬运和更新更复杂
        risks:
          - 后续打印机、串口等 Windows 本机设备访问更复杂
          - 非技术现场人员维护门槛高
      - name: 绿色解压包 + 启动脚本
        benefits:
          - 最简单
        costs:
          - 服务自启动、更新覆盖和异常恢复不完整
        risks:
          - 现场出错时维护体验较差
    decision: 第一版建议采用 Windows 安装包，把后端、浏览器管理端静态文件、SQLite 数据库目录和 Windows 后台服务一起安装到电脑；更新时运行新版安装包或后续版本的覆盖更新包，保留数据目录。
    reason_summary:
      - 单机局域网部署适合原生 Windows 服务
      - 现场大概率没有 Docker 基础和稳定镜像拉取条件
      - 后续打印机和电子秤需要本机设备访问
      - 安装包更符合“简单好上手、方便后期更新维护”
    conditions:
      - 后端电脑为 Windows 10/11
      - 安装包可保留独立数据目录，升级时不覆盖业务数据
      - 第一版不依赖 Docker
    action: 待用户确认后，将 DEC-025 标记为 active/approved，并纳入架构设计和部署方案
    expected_result: 第一版确定采用 Windows 安装包和后台服务，便于现场安装和升级
    reversal_plan: 后续出现多机部署、统一环境或云端化需求时，再评估 Docker/容器化
    observation: 用户答复“我也同意安装包策略”
    actual_result: 第一版部署方式已确定为 Windows 安装包 + 后台服务
    outcome_status: successful
    lesson: null
    evidence:
      - user-statement/2026-09-09 询问电脑端部署形式
    supersedes: []
    created_at: "2026-09-09T06:30:00Z"
    updated_at: "2026-09-09T06:50:00Z"
  - id: DEC-024
    title: 第一版技术栈：FastAPI + SQLite + Android 原生 + 浏览器管理端
    category: technical
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DEVICE-001
      - BL-DEVICE-002
      - BL-SCOPE-001
      - BL-DATA-001
      - BL-WEIGH-003
    context: 用户确认后端运行在 Windows 10/11，平板为 Android，电脑端使用浏览器管理端；此前认可 Python FastAPI、SQLite 和 Android APK 的组合。
    hypothesis: Python FastAPI 提供 API 和静态浏览器前端、SQLite 管理单机数据、Android 原生打包 APK，是当前现场约束下运维最轻、交付最快的组合。
    options:
      - name: FastAPI + SQLite + Android 原生 + 浏览器 SPA
        benefits:
          - 部署简单
          - 后端、管理端同一服务
          - 平板 APK 可直接安装
          - 后续串口、打印和 Excel 库生态成熟
        costs:
          - 需要开发前端和 Android 两端
        risks:
          - SQLite 多客户端并发需测试，但第一版规模风险低
      - name: Spring Boot + PostgreSQL + Flutter
        benefits:
          - 企业级能力更强
        costs:
          - 部署和开发复杂度更高
        risks:
          - 第一版交付和维护成本上升
      - name: Node.js + PostgreSQL + PWA
        benefits:
          - 前后端同一语言
        costs:
          - 串口、打印等本地上位机能力较弱
          - 不满足用户明确的 APK 安装方向
        risks:
          - 现场原生硬件能力依赖更复杂
    decision: 第一版采用 Python FastAPI + SQLite + Android 原生 Kotlin APK + 浏览器管理端；浏览器管理端使用 React + Vite 构建为静态文件，由 FastAPI 同端口提供。
    reason_summary:
      - 用户确认后端运行 Windows 10/11
      - 用户确认平板为 Android，需要 APK
      - 用户需要电脑端浏览器前端
      - 单机局域网部署下 SQLite 和 FastAPI 运维最轻
    conditions:
      - 后端电脑为 Windows 10/11
      - 平板为 Android 并支持安装 APK
      - 浏览器管理端与 API 只在内网访问
      - 第一版不连接电子秤，重量输入为 manual
    action: 更新 RES-002 为第一版技术栈方向，后续架构设计和任务拆解按其展开
    expected_result: 技术方案研究从候选讨论收敛到第一版确定的技术栈
    reversal_plan: 若后续并发或数据规模超出 SQLite，可迁移 PostgreSQL；前端框架如改 Vue 属于低风险调整
    observation: 用户答复技术栈按推荐执行，电脑端使用浏览器版本
    actual_result: RES-002 已按该方向更新，进入技术方案细化
    outcome_status: successful
    lesson: 技术选型应先围绕现场可运维性，而不是先追求企业级框架；浏览器管理端和 API 同端口部署可减少现场配置。
    evidence:
      - user-statement/2026-09-09 系统按 Windows 10/11 编写
      - user-statement/2026-09-09 平板是 Android
      - user-statement/2026-09-09 电脑端使用浏览器版本
    supersedes: []
    created_at: "2026-09-09T06:10:00Z"
    updated_at: "2026-09-09T06:10:00Z"
  - id: DEC-027
    title: 第一版架构输入默认规则已确认
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-WEIGH-003
      - BL-WEIGH-006
      - BL-WO-001
      - BL-DATA-001
      - BL-DEVICE-002
    context: 进入架构设计前，需要把称重口径、主数据/工单规则、账号审批、平板/网络、Windows 部署、标签打印等默认值固化。
    hypothesis: 用户按既定建议确认默认值后，架构设计可以停止重复询问业务口径，直接进入模块、接口和数据流定义。
    options:
      - name: 全部按建议默认确认
        benefits:
          - 减少架构设计往返
          - 业务规则一致
        costs:
          - 部分现场细节仍需在交付前验证
        risks:
          - 现场实际习惯与默认值不同，需要在测试阶段调整
      - name: 逐项再给客户确认
        benefits:
          - 更谨慎
        costs:
          - 流程变慢
        risks:
          - 重复确认已给出建议的默认项
    decision: 第一版按推荐的默认规则执行：净重 kg 输入、读数照片包含材料和读数、默认允差 5g 或 1% 较大值、工单保存配方快照、Excel 新增不覆盖、工单可暂停续作、管理员审批、无离线队列、Windows 11、最新 Android、支持 APK 和 Windows 安装包、安装包内置自动备份。
    reason_summary:
      - 用户答复“其他的我都同意你说的，没问题”
      - 用户补充默认 Windows 11、最新 Android 平板、支持安装应用、自动备份数据库
      - 架构设计具备明确输入
    conditions:
      - 第一版后端按 Windows 11 部署
      - 平板按最新 Android 系统适配并支持安装 APK
      - 安装包内置自动备份数据库
    action: 更新 REQ-001 为 v4，并作为架构设计输入
    expected_result: 架构设计不再需要重新猜测业务默认规则
    reversal_plan: 现场测试发现默认规则不符合实际情况时，通过变更流程调整设置或基线
    observation: 用户确认平板用最新安卓系统、其他按建议默认、Windows 按 Windows 11、平板和 Windows 都支持安装应用、自动备份数据库
    actual_result: 架构设计输入已固化
    outcome_status: successful
    lesson: 默认规则一旦确认，应合并成单一决策记录，避免架构阶段被多份散落问题反复打断。
    evidence:
      - user-statement/2026-09-09 架构设计默认规则确认
      - .project-log/docs/solution-research-input-questions.md
    supersedes: []
    created_at: "2026-09-09T07:00:00Z"
    updated_at: "2026-09-09T07:00:00Z"
  - id: DEC-026
    title: 第一版手动称重必须同时保存电子秤读数照片
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-WEIGH-003
      - BL-WEIGH-006
    context: 第一版不连接电子秤，重量由操作员手动输入；用户认为仅记录数字不保险，要求同时拍摄电子秤读数图片作为称重证据。
    hypothesis: 将“数字重量 + 电子秤读数照片”设为手动称重的强制证据，可以在不接入电子秤的第一版提高重量追溯和防错能力。
    options:
      - name: 数字重量 + 电子秤读数照片一起留痕
        benefits:
          - 操作员不能只凭记忆或任意数字提交
          - 后台可核对读数照片和输入重量
          - 后续追溯更完整
        costs:
          - 操作员每次称重需要多一个拍照动作
        risks:
          - 照片可能拍不清或拍错，需要现场操作规范
      - name: 只记录手动输入数字
        benefits:
          - 操作最快
        costs:
          - 无法核实读数是否真实
        risks:
          - 重量错误难以追溯，防错强度不足
      - name: 电子秤自动读取
        benefits:
          - 自动读数最可靠
        costs:
          - 需要现场硬件、协议和验证
        risks:
          - 当前不在现场，无法作为第一版范围
    decision: 第一版手动称重必须在平板同时提交数字重量和电子秤读数照片；系统将两者一起保存，缺少任一证据则不能完成该辅料步骤。
    reason_summary:
      - 用户明确要求重量确认增加拍照留痕
      - 手动输入数字不能独立证明重量真实
      - 拍照证据可提高第一版防错和追溯能力
    conditions:
      - 操作员每次确认重量时必须拍摄电子秤读数照片
      - 照片和数字重量必须同时落库
      - 照片缺失或无法辨认时禁止完成重量步骤
    action: 更新 BL-WEIGH-003、BL-WEIGH-006、REQ-001 v3 和操作员工作流文档
    expected_result: 重量记录同时包含手动数字、读数照片、操作员和时间
    reversal_plan: 后续接入自动读秤后，自动读数可替代手动拍照或按新方案调整
    observation: 用户答复“重量确认这里，希望增加一个拍照的要求，两个信息一起记录下来”
    actual_result: 需求基线 v3 已加入电子秤读数照片强制证据要求
    outcome_status: successful
    lesson: 手动输入类业务应优先增加图片/视频等旁证，避免数字记录成为不可验证的单一事实。
    evidence:
      - user-statement/2026-09-09 手动称重必须拍照电子秤读数
      - .project-log/business-logic/atoms.yaml#BL-WEIGH-006
    supersedes: []
    created_at: "2026-09-09T06:40:00Z"
    updated_at: "2026-09-09T06:40:00Z"
  - id: DEC-001
    title: 辅料称重防错系统不连接金蝶，独立交付
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-SCOPE-001
    context: 客户原环境存在金蝶系统，但接口、功能和权限未知，需要确定系统交付边界。
    hypothesis: 独立系统可以更快交付核心防错能力，并且不被金蝶改造复杂度阻塞。
    options:
      - name: 独立系统
        benefits:
          - 不依赖金蝶能力
          - MVP 边界清晰、交付更快
          - 便于现场简单上手
        costs:
          - 产品、配方和辅料主数据需要在本系统维护或导入
        risks:
          - 未来若需与金蝶联动，需要另做接口
      - name: 金蝶子系统或嵌入金蝶
        benefits:
          - 可能复用现有主数据和账号体系
        costs:
          - 需要先研究金蝶开发方式和权限
          - 交付周期和复杂度显著增加
        risks:
          - 可能被金蝶平台能力阻塞
    decision: 独立系统，不连接金蝶
    reason_summary:
      - 客户明确反馈独立且不连接金蝶
      - 范围聚焦辅料类型确认和重量校验
      - 简单、好上手是当前优先目标
    conditions:
      - 产品、配方和辅料主数据由本系统维护或导入
    action: 将 Q-001 标记为 answered，并更新业务边界为独立系统
    expected_result: 后续澄清和实现不再依赖金蝶接口
    reversal_plan: 未来如需要对接金蝶，再作为独立增量做接口方案
    observation: Q-001 已由用户回答为独立系统，且不连接金蝶
    actual_result: 业务澄清以独立系统为边界推进
    outcome_status: successful
    lesson: null
    evidence:
      - .project-log/business-logic/open-questions.yaml
    supersedes: []
    created_at: "2026-09-08T07:59:53Z"
    updated_at: "2026-09-08T07:59:53Z"
  - id: DEC-002
    title: 产品、配方和辅料主数据由用户在本系统内自主维护
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DATA-001
    context: 系统已确认不连接金蝶，因此需要确定产品、配方和辅料信息如何进入独立系统。
    hypothesis: 由系统提供基础数据管理功能，用户可以自行录入和维护，最符合独立、简单、好上手的交付目标。
    options:
      - name: 本系统内维护，支持手工录入和 Excel 导入
        benefits:
          - 不依赖外部系统
          - 数据量少或大时都可使用
          - 用户日常可直接管理生产基础数据
        costs:
          - 需要实现基础数据管理界面和数据校验
        risks:
          - 数据重复或录入错误需要靠界面校验和后续治理
      - name: 仅手工录入
        benefits:
          - 实现最简单
        costs:
          - 初始化和批量修改成本高
        risks:
          - 数据量大时难以维护
      - name: 继续依赖金蝶等外部系统
        benefits:
          - 可能复用现有主数据
        costs:
          - 与独立系统决策冲突
        risks:
          - 交付复杂度和阻塞风险高
    decision: 由用户在本系统内自行创建和维护产品、产品配料和辅料信息，并保留 Excel 模板导入能力。
    reason_summary:
      - 客户明确要求系统提供这些管理功能
