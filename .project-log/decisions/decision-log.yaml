      - 粘贴后扫码复核可降低贴错标签的防错漏洞
    conditions:
      - 标签打印需要电脑后台具备标签打印界面或打印设备
      - 辅料主数据保存默认保质期
      - 标签记录不物理删除，作废标签保留
    action: 将 Q-017 标记为 answered，并将 BL-LABEL-001 更新为用户确认的业务原子
    expected_result: 第一版按统一标签流程生成、打印、粘贴和复核自制二维码
