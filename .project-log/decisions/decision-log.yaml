  - id: DEC-045
    title: APP 保持强制横屏并让手机与平板共用完整功能
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks:
      - TASK-120
    related_business_logic:
      - BL-DEVICE-003
    context: 用户计划让现有 Android APP 同时安装到手机和平板。当前 APP 固定横屏，但界面按平板宽屏设计，手机横屏出现空间挤压、组件错位和内容显示不全。用户明确强制横屏没有问题，并要求手机端和平板端功能完全相同。
    hypothesis: 保持单一横屏 APP，通过基于可用宽高的响应式布局切换导航、列数、间距、表单和弹窗形态，可以在不复制业务代码、不裁剪功能的情况下同时支持手机和平板。
    options:
      - name: 单一横屏 APP，响应式适配手机和平板
        benefits:
          - 功能、权限和业务逻辑保持完全一致
          - 不维护两套客户端
          - 平板现有工作方式可以保留
        costs:
          - 需要系统梳理固定宽度、固定高度和横向并排布局
          - 需要增加手机短高度和多尺寸验收
        risks:
          - 若适配仅处理宽度，仍可能在手机短高度下出现弹窗和键盘遮挡
      - name: 手机端提供精简功能
        benefits:
          - 手机页面更简单
        costs:
          - 不符合用户要求
          - 需要维护功能差异和权限说明
        risks:
          - 同一账号在不同设备看到不同能力，产生业务不一致
      - name: 手机和平板使用两套 APP
        benefits:
          - 两端可以完全独立设计
        costs:
          - 开发和维护成本显著增加
          - 功能容易漂移
        risks:
          - 后续修复和发布需要同步两套客户端
    decision: APP 继续强制横屏；手机端和平板端使用同一 APP、同一业务功能和同一角色权限；仅根据设备可用宽高自适应布局。手机横屏重点解决短高度、滚动可达性、弹窗高度和键盘遮挡，平板保持宽屏多列布局。
    reason_summary:
      - 用户明确确认强制横屏符合产品定位
      - 用户明确要求手机端和平板端功能完全相同
      - 单一客户端和单一业务逻辑更易长期维护
    conditions:
      - 不提供竖屏模式
      - 不因手机尺寸隐藏、禁用或降级任何业务功能
      - 布局适配不得改变角色权限、接口、数据或审批流程
      - 手机横屏必须覆盖登录、工单、扫码、称重、资料和管理员主数据功能
      - 平板现有功能不得因适配发生业务倒退
    action: 固化 BL-DEVICE-003 和 REQ-001 v19，创建 TASK-120 用于后续手机与平板横屏响应式改造
    expected_result: 手机和平板横屏均能使用完整功能，页面无不可恢复的挤压、错位、截断或不可操作状态
    reversal_plan: 若后续客户改为竖屏或功能差异方案，需要重新确认产品边界并替换 BL-DEVICE-003，不能直接把当前响应式约束扩展为竖屏适配
    observation: 用户答复“强制横平没问题，这个app本来就是设计来适配横屏使用的。然后手机端功能和平板端完全相同”，随后确认“可以需求没问题，现在记录一下这部分业务逻辑”
    actual_result: 业务规则已记录，尚未进行客户端布局改造
    outcome_status: not-observed
    lesson: 跨手机和平板的适配应优先保证功能一致性，并以短高度可达性和完整业务流程作为验收对象
    evidence:
      - user-statement/2026-09-21 手机与平板横屏功能一致
