  - id: DEC-033
    title: PC 管理员紧急恢复采用后端哈希校验和一次性临时密码
    category: security
    status: active
    authority: C
    user_approval: approved
    related_tasks:
      - TASK-054
    related_business_logic:
      - BL-AUTH-006
    context: 用户要求增加管理员密码遗忘后的紧急恢复能力，并希望恢复口令保存在后端哈希中。若把恢复口令写入前端或仓库，任何人都可以从下载的 JavaScript 或源码中读取；若直接覆盖为固定密码，也无法证明谁触发了重置。
    hypothesis: 使用登录框隐藏热点打开恢复窗口，由后端与 PBKDF2 哈希比对恢复口令；成功后生成随机临时密码、强制首次改密、递增账号认证版本使旧会话失效，并持久化失败审计，可以在不暴露明文口令的前提下提供可控恢复能力。
    options:
      - name: 后端哈希恢复口令、限流、审计和随机临时密码
        benefits:
          - 恢复口令明文不进入前端和 Git
          - 旧登录令牌在重置后立即失效
          - 临时密码只显示一次并强制修改
          - 失败尝试和成功恢复均有审计记录
        costs:
          - 需要维护忽略版本控制的部署配置
          - 恢复接口必须增加锁定和审计逻辑
        risks:
          - 恢复口令一旦泄露，持有者可在局域网内触发管理员重置
      - name: 前端硬编码恢复口令并直接重置管理员
        benefits:
          - 实现简单
        costs:
          - 口令随浏览器代码公开
          - 前端可以伪造重置结果
        risks:
          - 形成无法收口的系统后门
    decision: PC 登录页右上角热点在 3 秒内连续点击 10 次后打开管理员紧急恢复窗口；窗口仅提交恢复口令，后端使用 PBKDF2 哈希校验。连续失败 5 次锁定 15 分钟；成功后随机生成 10 位临时密码，设为强制首次改密，并递增管理员 `auth_version` 使旧令牌失效。恢复口令哈希存放在后端本地配置中，不提交 Git，明文不出现在前端和后端接口响应中。
    reason_summary:
      - 用户批准后端哈希存储和隐藏入口
      - 恢复能力必须保持可审计、可限流且不能暴露明文
      - 临时密码和会话失效可以限制恢复后的风险窗口
    conditions:
      - 未配置恢复口令哈希时恢复接口返回功能未配置，不允许绕过校验
      - 10 次点击只用于打开窗口，不作为安全凭证
      - 恢复成功后临时密码只在响应和当前弹窗中显示一次
      - 管理员旧令牌必须立即失效，使用临时密码登录后必须改密
      - 恢复失败、锁定和成功动作写入审计日志，不记录候选口令
      - 部署配置中的哈希必须随本地安装数据保留，不得提交到个人仓库
    action: 新增管理员恢复接口、尝试限流与锁定、认证版本校验、恢复弹窗和登录页隐藏点击入口。
    expected_result: 管理员密码遗忘时可在后端配置有效的前提下通过隐藏恢复窗口生成一次性临时密码，旧会话立即失效，整个过程可审计。
    reversal_plan: 若后续需要更强的身份验证，可在此基础上增加离线恢复码、硬件密钥或仅本机命令行恢复，但不得退回前端明文口令。
    observation: 用户确认使用后端哈希保存恢复口令，并要求保持登录页隐藏入口。
    actual_result: 隐藏入口、后端哈希校验、限流锁定、审计、旧会话失效、随机临时密码和浏览器恢复流程均已实现并通过测试；真实管理员密码在验证后已恢复原状态。
    outcome_status: successful
    lesson: 紧急恢复能力必须建立在服务端秘密、限流、审计和一次性凭据上，隐藏 UI 只能负责降低无意发现概率，不能承担认证职责。
    evidence:
      - EV-TASK-054-RECOVERY
    supersedes: []
    created_at: "2026-09-12T13:05:00Z"
    updated_at: "2026-09-12T13:05:00Z"
  - id: DEC-032
    title: PC 顶栏用户菜单复用本人资料与密码自助接口
    category: technical
    status: active
    authority: B
    user_approval: approved
    related_tasks:
      - TASK-053
    related_business_logic:
      - BL-AUTH-002
      - BL-AUTH-005
    context: 用户要求 PC 管理端右上角头像与平板端一样提供下拉菜单，包含用户信息、密码管理和退出登录；PC 已具备本人资料查询、本人资料更新和凭当前密码修改密码的后端接口。
    hypothesis: 复用现有 `/auth/me` 与 `/auth/me/change-password` 自助接口，在 PC 顶栏提供与后端权限一致的用户菜单，可以避免为电脑端复制账号业务逻辑，并保证平板和 PC 对本人资料及密码使用同一套持久化规则。
    options:
      - name: 复用现有本人资料和改密接口
        benefits:
          - 平板和 PC 共用同一业务规则与数据
          - 不新增重复或分叉的账号接口
          - 修改后顶栏和本地会话可立即更新
        costs:
          - PC 与 APP 同时依赖本人账号自助接口
        risks:
          - 后续修改账号自助契约时需同时回归两个客户端
      - name: 为 PC 单独新增资料和改密接口
        benefits:
          - 两端接口可独立演进
        costs:
          - 增加重复实现和权限漂移风险
        risks:
          - 同一用户的资料或密码可能在不同端表现不一致
    decision: PC 顶栏头像下拉菜单提供用户信息、密码管理和退出登录；用户信息复用 `/auth/me`，密码管理复用 `/auth/me/change-password`，不新增 PC 专用账号业务接口。账号、角色和身份证属于只读信息，本人只能修改头像、姓名和电话；密码修改必须验证当前密码。
    reason_summary:
      - 业务规则已确认本人可维护头像、姓名、电话并凭当前密码自助改密
      - 复用统一接口可以避免 PC 与 APP 规则分叉
      - 下拉菜单只是 PC 端的业务入口，不改变账号数据模型
    conditions:
      - 点击头像或右侧箭头均可打开菜单
      - 菜单至少包含用户信息、密码管理和退出登录
      - 用户信息保存后顶栏头像和姓名立即刷新
      - 密码修改成功后新密码立即生效，仍可按当前登录态继续使用系统
      - 点击菜单外部或按 Escape 可以关闭菜单
    action: 在 PC AppShell 增加用户菜单，新增本人资料和改密弹窗及 API 适配，并复用已有文件上传能力维护头像。
    expected_result: PC 管理员可在右上角查看和维护本人资料、修改密码并安全退出登录，无需进入账号管理页面。
    reversal_plan: 若未来 PC 与 APP 的自助资料规则发生实质分歧，可增加客户端能力配置，但继续共用底层身份和密码数据。
    observation: 用户要求“点击头像旁边的向下箭头弹出下拉列表，包含用户信息、密码管理和退出登录”。
    actual_result: PC 菜单、用户信息、密码管理和退出登录均已接通；临时管理员实测资料更新和密码修改成功后可使用新密码登录。
    outcome_status: successful
    lesson: 同一账号自助能力应优先复用统一后端契约，客户端只实现符合自身交互环境的管理入口。
    evidence:
      - EV-TASK-053-USER-MENU
    supersedes: []
    created_at: "2026-09-12T12:35:00Z"
    updated_at: "2026-09-12T12:35:00Z"
  - id: DEC-031
    title: PC 管理端使用独立管理员登录入口
    category: technical
    status: active
    authority: B
    user_approval: not-required
    related_tasks:
      - TASK-052
    related_business_logic:
      - BL-AUTH-001
    context: 用户实测普通操作员账号可以登录 PC 管理端。根因是 PC 与平板共用 `/auth/login`，该接口按平板业务允许普通操作员登录，PC 前端又只判断登录是否成功，没有强制校验管理员角色。
    hypothesis: 为电脑管理端增加独立管理员登录入口，并继续保留平板端通用登录入口，可以在不破坏平板业务流程的前提下明确隔离两个端点的访问权限；前端恢复持久化会话时再次校验角色，可防止旧本地数据绕过登录页。
    options:
      - name: PC 管理端使用独立管理员登录接口
        benefits:
          - 权限边界由后端明确执行，不依赖前端隐藏页面
          - 平板端普通操作员登录行为保持不变
          - 可对越权登录返回稳定且可读的错误码
        costs:
          - PC 与 APP 使用两个登录路径
        risks:
          - 后续新增客户端时必须明确选择正确入口
      - name: 继续共用登录接口，仅由前端拦截普通操作员
        benefits:
          - 不需要新增接口
        costs:
          - 后端仍会为普通操作员签发 PC 可用令牌
          - 前端遗漏判断或旧会话恢复时可能再次越权
        risks:
          - 权限控制不可靠
    decision: PC 管理端固定使用 `POST /api/v1/auth/admin/login`，该接口在账号密码正确后仍要求 `role=admin`，普通操作员返回 `403 ADMIN_PORTAL_REQUIRED`；平板端继续使用 `POST /api/v1/auth/login`。PC 前端只恢复管理员持久化会话，`/auth/me` 结果不是管理员时立即清理本地登录态。
    reason_summary:
      - 业务规则已明确普通操作员不能进入电脑后台
      - 权限必须由后端强制执行，前端校验作为补充防线
      - 分离入口比修改通用登录接口更能保持平板端行为稳定
    conditions:
      - 平板普通操作员通过 `/auth/login` 登录的行为不变
      - PC 登录失败时不得保存令牌或用户角色
      - PC 启动恢复会话时必须向后端重新校验用户角色
      - 普通操作员登录 PC 时显示“普通操作员账号不能登录电脑管理端”
    action: 新增管理员专用登录接口，将 PC API 登录路径切换到该接口，并在本地会话恢复时增加管理员角色校验和回归测试。
    expected_result: 普通操作员只能登录平板端；即使本机存在旧会话数据，也不能进入 PC 管理界面。
    reversal_plan: 若未来需要支持管理员从平板进入管理功能，可新增经过角色校验的共享管理接口，但不得放宽当前 PC 入口。
    observation: 用户以真实普通操作员账号成功进入了 PC 管理端。
    actual_result: 普通操作员调用通用登录接口仍为 200，调用管理员专用接口为 403；浏览器登录页保持在管理员登录界面并显示拒绝原因。
    outcome_status: successful
    lesson: 同一认证能力服务不同客户端时，入口必须显式承载客户端的角色边界，不能只复用账号密码校验。
    evidence:
      - EV-TASK-052-ADMIN-GUARD
    supersedes: []
    created_at: "2026-09-12T12:05:00Z"
    updated_at: "2026-09-12T12:05:00Z"
  - id: DEC-030
    title: PC 端业务数据采用统一短轮询和写操作事件同步
    category: technical
    status: active
    authority: B
    user_approval: not-required
    related_tasks:
      - TASK-051
    related_business_logic: []
    context: 用户指出 PC 端审批红点在工单页完成审批后不会立即消失，并进一步要求整个服务的业务状态都自动刷新，而不是只处理单个红点。
    hypothesis: 对一个单机局域网部署、页面数量有限且变更频率不高的管理系统，使用 5 秒短轮询统一触发当前页面刷新，并在本机写操作完成后立即发送同步事件，可以兼顾数据及时性、实现稳定性和部署维护成本。
    options:
      - name: 统一短轮询加写操作即时刷新
        benefits:
          - 不依赖长连接或额外基础设施
          - 对 Windows、浏览器、代理和断线恢复更稳健
          - 能统一覆盖工作台、工单、审批、主数据、标签和账号设置
        costs:
          - 空闲时仍会周期性请求增量很小但非零的数据
          - 其他客户端产生的变化存在最多约 5 秒延迟
        risks:
          - 如果未来页面或客户端数量大幅增加，需要评估请求量
      - name: SSE 服务器推送
        benefits:
          - 其他客户端的变化可以近实时推送
          - 单向事件流比 WebSocket 更轻量
        costs:
          - 需要新增事件总线、长连接认证和断线恢复逻辑
          - 需要所有写接口发布领域事件
        risks:
          - 代理、休眠恢复和部署形态会引入额外运维复杂度
      - name: WebSocket 双向连接
        benefits:
          - 支持双向实时通信
          - 后续可扩展实时协同
        costs:
          - 对当前主要是只读刷新和少量写操作的场景明显过度
        risks:
          - 连接状态、重连和鉴权逻辑更复杂
    decision: PC 端采用统一的 5 秒短轮询同步机制；所有非 GET API 成功后立即发送本地数据同步事件；当前页面、详情弹窗和审批数量监听统一事件并按需重新请求后端。SSE 和 WebSocket 暂不启用，保留为未来多客户端大规模或强实时需求出现时的演进方案。
    reason_summary:
      - 当前系统部署在单机 Windows 局域网环境，短轮询不存在基础设施障碍
      - 核心需求是页面状态保持一致，不要求毫秒级实时推送
      - 统一事件和统一同步周期可以避免每个页面各写一套轮询逻辑
      - 本机写操作即时刷新，其他客户端变化由短轮询兜底
    conditions:
      - 当前页面无表单正在提交时，静默刷新不得造成加载页面闪烁
      - 浏览器页面隐藏时暂停刷新，重新可见或获得焦点时立即同步
      - 网络临时失败时保留最后一次成功数据，不清空页面
      - 写操作成功后立即刷新，不必等待下一次轮询
    action: 增加统一数据同步事件、自动刷新 Hook 和审批数量轮询，并接入工作台、工单、审批、辅料、配方、标签、账号设置和工单详情弹窗。
    expected_result: 本机审批后红点立即更新；其他电脑、平板产生的业务变化在当前页面最多约 5 秒自动显示，无需切换页面或手动刷新。
    reversal_plan: 若后续客户端规模明显增加或需要强实时事件，可将统一同步层替换为 SSE/WebSocket，同时保留现有页面刷新接口和行为边界。
    observation: 用户反馈红点必须切换页面才消失，并要求整个服务状态自动刷新。
    actual_result: PC 端各业务页面和全局审批数量已接入统一自动同步机制，浏览器回归验证通过。
    outcome_status: successful
    lesson: 对低并发、低实时要求的局域网管理系统，统一短轮询通常比引入实时长连接更稳健、维护成本更低。
    evidence:
      - EV-TASK-051-PC-SYNC
