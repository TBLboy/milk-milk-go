        risks:
          - 贴错码会引入新的类型错误
      - name: 仅现有码加拍照审批
        benefits:
          - 不需要增加贴码工作
        costs:
          - 自动识别覆盖率低
        risks:
          - 无码和无效码辅料依赖人工审批
      - name: 混合方案
        benefits:
          - 现有有效码可自动匹配
          - 无码或无法匹配辅料仍可走审批流程
          - 保留未来贴码增强能力
        costs:
          - 需要同时处理扫码和拍照申请两条流程
        risks:
          - 无码辅料的自动防错能力有限
    decision: 第一版采用方案 C 混合方案：现有有效码映射到内部代号后自动匹配；无码、无效码或未映射码走拍照、手动选择辅料和后台审批；自制二维码贴纸作为后续增强。
    reason_summary:
