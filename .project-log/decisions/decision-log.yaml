  - id: DEC-018
    title: 辅料与产品配方主数据在电脑端和平板端录入的权限及范围
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DATA-003
      - BL-DATA-004
    context: 用户要求辅料录入需要保存中文名称、英文名称/代号、公司内部代号、保质期和多张包装图片，并希望电脑和平板都能录入；产品配方从现有辅料库选择并填写每吨用量。需要明确双端录入范围和权限。
    hypothesis: 平板端增加管理员角色入口，由管理员完成辅料和产品配方录入，普通操作员只能执行称重工单相关操作，可以同时满足拍照方便性和权限控制。
    options:
      - name: 电脑和平板均可录入，仅管理员可操作
        benefits:
          - 平板可直接拍辅料包装图
          - 电脑可批量选择已有图片
          - 权限边界清晰
        costs:
          - 平板端需要区分普通操作员和管理员
        risks:
          - 管理员账号若被冒用，错误主数据风险更高
      - name: 仅电脑端可录入
        benefits:
          - 首版角色模型简单
        costs:
          - 现场拍摄和录入辅料不方便
        risks:
          - 不符合用户对平板拍照录入的需求
      - name: 所有账号均可录入
        benefits:
          - 操作门槛最低
        costs:
          - 无法控制主数据质量
        risks:
          - 普通操作员可能误建辅料或配方
    decision: 第一版辅料信息和产品配方信息均支持电脑后台和平板端录入，但仅管理员账号可操作；APP 根据账号角色展示管理员功能入口。辅料录入支持多张包装图片，电脑端可从本地文件选择，平板端可从相册选择或直接拍摄；产品配方从现有辅料库选择辅料并填写每吨用量，不涉及图片，无现有辅料时先补录辅料再录配方。
    reason_summary:
      - 用户明确提出双端录入和图片需求
      - 平板非常适合现场拍摄包装外观
      - 产品配方必须依赖已存在的辅料主数据，避免游离辅料进入工单计算
    conditions:
      - APP 必须支持普通操作员和管理员角色区分
      - 管理员账号来源保持为后台预置/后台创建，不从平板普通注册获得管理员权限
      - 辅料图片长期保存并作为工单追溯的辅料参考资料
    action: 新增 BL-DATA-003、BL-DATA-004，并将录入规则写入业务澄清
    expected_result: 管理员可在电脑和平板端录入辅料及产品配方，普通操作员不可进入主数据管理
    reversal_plan: 如首版平板管理员功能开发量过大，可先保证电脑端管理，平板端只开放浏览/拍摄申请能力，再迭代放开管理
    observation: 用户答复“能理解我的意思吗”，实际描述了完整的辅料和产品配方录入规则
    actual_result: 双端录入、图片录入和管理员权限已纳入第一版业务逻辑
    outcome_status: successful
    lesson: null
    evidence:
      - user-statement/2026-09-09 辅料与产品配方录入细节
    supersedes: []
    created_at: "2026-09-09T03:55:00Z"
    updated_at: "2026-09-09T03:55:00Z"
  - id: DEC-019
    title: 辅料主数据字段清单与英文名称选填规则
    category: data
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DATA-003
      - BL-LABEL-001
    context: 辅料录入范围已确认，但字段清单和必填规则尚未最终确定，需要与 Excel 模板、平板电脑端录入界面保持一致。
    hypothesis: materialId 自动生成、materialCode 和中文名称必填、英文名称选填、默认保质期必填，可以兼容没有英文资料的辅料，同时保证现场身份识别和标签计算可依赖。
    options:
      - name: 英文名称选填
        benefits:
          - 不阻塞缺少英文资料的辅料
          - 有英文资料时仍可保存
        costs:
          - 模板中出现空字段，需要允许为空
        risks:
          - 无
      - name: 英文名称必填
        benefits:
          - 字段完整度更高
        costs:
          - 英文资料缺失时无法录入辅料
        risks:
          - 现场可能被卡住
      - name: 不单独设置英文名称
        benefits:
          - 字段最少
        costs:
          - 丢失去客户现有英文称谓信息
        risks:
          - 后续需要英文信息时再补字段
    decision: 第一版辅料字段按以下规则：materialId 系统自动生成且不可变；materialCode 公司内部代号必填；中文名称必填；英文名称选填；默认保质期必填；enabled 默认启用；包装图片支持多张。英文名称不作为身份匹配字段。
    reason_summary:
      - 用户确认按推荐方案执行
      - 英文名称属于补充资料，不应阻塞辅料录入和标签生成
      - 内部代号和中文名称足以支持现场展示和辅料匹配
    conditions:
      - Excel 辅料模板需包含上述字段并按相同必填规则校验
      - 二维码标签展示以 materialCode 和中文名称为主，英文名称可选展示
    action: 将 Q-020 标记为 answered，并更新 BL-DATA-003 的字段规则
    expected_result: 辅料字段和必填规则进入第一版业务基线
    reversal_plan: 若客户后续要求英文名称必填，可调整录入校验和 Excel 模板
    observation: 用户答复“可以没问题，就按照你说的来”
    actual_result: 辅料主数据字段方案已纳入第一版业务基线
    outcome_status: successful
    lesson: null
    evidence:
      - .project-log/business-logic/open-questions.yaml#Q-020
    supersedes: []
    created_at: "2026-09-09T04:00:00Z"
    updated_at: "2026-09-09T04:00:00Z"
  - id: DEC-020
    title: 第一版后端主机与局域网部署边界
    category: technical
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DEVICE-002
      - BL-LABEL-001
    context: 已确认系统为电脑后端 + 平板 App 局域网架构，需要确认后端使用哪台主机、现场网络条件和标签打印设备。
    hypothesis: 使用现场已有电脑作为后端，平板与后端处于同一 WiFi，系统不依赖互联网，可以形成简单稳定的第一版部署方案。
    options:
      - name: 现场可用电脑作为后端
        benefits:
          - 无需额外采购后端主机
          - 便于接标签打印机和后续串口
        costs:
          - 需要现场电脑稳定运行服务
        risks:
          - 电脑被占用或关机会影响系统
      - name: 使用 Q1S 收款机作为后端
        benefits:
          - 可复用现有设备
        costs:
          - 性能、系统兼容和扩展能力需要验证
        risks:
          - 可能不适合运行数据库和局域网服务
      - name: 平板/电脑均不固定
        benefits:
          - 灵活
        costs:
          - 网络和硬件可用性不稳定
        risks:
          - 现场维护成本高
    decision: 第一版后端和数据库部署在客户现场可用电脑上；现场已有可用 WiFi，平板与后端电脑处于同一局域网，系统不依赖互联网；标签打印由后台管理员在电脑端完成。
    reason_summary:
      - 用户确认现场有后端电脑和可用 WiFi
      - 专用电脑比 Q1S 更适合作后端
      - 局域网方案满足多平板并发的业务目标
    conditions:
      - 后端电脑需要固定在现场并可长期运行
      - 平板和后端电脑需处于同一 WiFi/局域网
      - 标签打印设备类型由 Q-021 继续确认
    action: 将 Q-019 标记为 answered，并新增 BL-DEVICE-002 部署业务原子
    expected_result: 第一版按现场电脑 + 局域网 WiFi 的部署边界推进
    reversal_plan: 若现场无法固定后端电脑或 WiFi 不稳定，可改为后端电脑直连有线交换机，平板通过局域网访问
    observation: 用户答复“可以没问题，现场有后端电脑，有可用wifi”
    actual_result: 后端主机和网络部署边界已纳入第一版业务基线
    outcome_status: successful
    lesson: null
    evidence:
      - .project-log/business-logic/open-questions.yaml#Q-019
