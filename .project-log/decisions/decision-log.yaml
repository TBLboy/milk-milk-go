  - id: DEC-022
    title: 第一版二维码标签日期以标签打印日期为准
    category: data
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-LABEL-001
      - BL-LABEL-002
    context: 早期方案建议打印时录入实际生产日期并据此计算到期日期；用户确认第一版不管理实际生产日期，暂时以标签打印日期为二维码标签日期。
    hypothesis: 第一版只记录标签打印日期，可以简化打印界面并避免现场必须补录生产日期；实际生产日期和有效期管理留到后续批次/有效期需求出现时再增加。
    options:
      - name: 只使用标签打印日期
        benefits:
          - 打印界面简单
          - 不阻塞补打场景
        costs:
          - 二维码中不再包含真实生产日期
        risks:
          - 后续需要批次追溯时需补录历史数据
      - name: 打印前录入实际生产日期
        benefits:
          - 可计算到期日期
        costs:
          - 每次打印都要录入，现场操作更繁琐
        risks:
          - 生产日期填错会影响有效期判断
      - name: 既不录入也不保存任何日期
        benefits:
          - 数据最少
        costs:
          - 丢失标签打印时间线索
        risks:
          - 无法追溯标签产生时间
    decision: 第一版标签打印界面不录入实际生产日期；二维码标签日期以系统当前打印时间 printedAt 为准；第一版不对实际生产日期和到期日期做业务校验，后续需要批次、有效期或到期校验时再增强。
    reason_summary:
      - 用户明确“不管实际生产日期，暂时只管标签打印日期”
      - 简化第一版打印流程和标签字段
      - 现有防错核心是辅料类型和重量，不依赖有效期校验
    conditions:
      - 标签记录和二维码中的日期字段以 printedAt 为准
      - productionDate、shelfLifeMonths、expiryDate 暂不作为第一版业务判断字段
      - 后续如增加有效期管理，需要重新定义字段和打印界面
    action: 将 Q-022 标记为 answered，更新 BL-LABEL-001 和标签业务逻辑
    expected_result: 第一版标签打印不录入生产日期，二维码以打印日期为标签日期
    reversal_plan: 若客户后续要求有效期校验，可在打印界面增加实际生产日期录入和到期日期计算
    observation: 用户答复“不管实际生产日期，暂时只管标签打印日期就行”
    actual_result: 第一版二维码标签日期规则已纳入业务基线
