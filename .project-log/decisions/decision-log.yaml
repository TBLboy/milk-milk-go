  - id: DEC-018
    title: 辅料与产品配方主数据在电脑端和平板端录入的权限及范围
    category: business
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-DATA-003
      - BL-DATA-004
    context: 用户要求辅料录入需要保存中文名称、英文名称/代号、公司内部代号、保质期和多张包装图片，并希望电脑和平板都能录入；产品配方从现有辅料库选择并填写每吨用量。需要明确双端录入范围和权限。
    hypothesis: 平板端增加管理员角色入口，由管理员完成辅料和产品配方录入，普通操作员只能执行称重工单相关操作，可以同时满足拍照方便性和权限控制。
    options:
      - name: 电脑和平板均可录入，仅管理员可操作
        benefits:
          - 平板可直接拍辅料包装图
          - 电脑可批量选择已有图片
          - 权限边界清晰
        costs:
          - 平板端需要区分普通操作员和管理员
        risks:
          - 管理员账号若被冒用，错误主数据风险更高
      - name: 仅电脑端可录入
        benefits:
          - 首版角色模型简单
        costs:
          - 现场拍摄和录入辅料不方便
        risks:
          - 不符合用户对平板拍照录入的需求
      - name: 所有账号均可录入
        benefits:
          - 操作门槛最低
        costs:
          - 无法控制主数据质量
        risks:
          - 普通操作员可能误建辅料或配方
    decision: 第一版辅料信息和产品配方信息均支持电脑后台和平板端录入，但仅管理员账号可操作；APP 根据账号角色展示管理员功能入口。辅料录入支持多张包装图片，电脑端可从本地文件选择，平板端可从相册选择或直接拍摄；产品配方从现有辅料库选择辅料并填写每吨用量，不涉及图片，无现有辅料时先补录辅料再录配方。
    reason_summary:
      - 用户明确提出双端录入和图片需求
      - 平板非常适合现场拍摄包装外观
      - 产品配方必须依赖已存在的辅料主数据，避免游离辅料进入工单计算
    conditions:
      - APP 必须支持普通操作员和管理员角色区分
      - 管理员账号来源保持为后台预置/后台创建，不从平板普通注册获得管理员权限
      - 辅料图片长期保存并作为工单追溯的辅料参考资料
    action: 新增 BL-DATA-003、BL-DATA-004，并将录入规则写入业务澄清
    expected_result: 管理员可在电脑和平板端录入辅料及产品配方，普通操作员不可进入主数据管理
    reversal_plan: 如首版平板管理员功能开发量过大，可先保证电脑端管理，平板端只开放浏览/拍摄申请能力，再迭代放开管理
    observation: 用户答复“能理解我的意思吗”，实际描述了完整的辅料和产品配方录入规则
    actual_result: 双端录入、图片录入和管理员权限已纳入第一版业务逻辑
    outcome_status: successful
