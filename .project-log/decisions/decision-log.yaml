  - id: DEC-014
    title: 第一版采用混合辅料识别方案
    category: business
    status: superseded
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-WEIGH-002
      - BL-RECOG-001
    context: 现场包装和码型不统一，现有码不能覆盖全部辅料，供应商二维码多为溯源信息，需要确定第一版如何识别辅料类型。
    hypothesis: 第一版先利用现有有效码自动匹配，无法稳定匹配的辅料走拍照申请审批，可以在不强制贴码的情况下验证完整防错闭环。
    options:
      - name: 自制二维码贴纸
        benefits:
          - 所有辅料统一可扫码
        costs:
          - 需要打印和粘贴
        risks:
          - 贴错码会引入新的类型错误
      - name: 仅现有码加拍照审批
        benefits:
          - 不需要增加贴码工作
        costs:
          - 自动识别覆盖率低
        risks:
          - 无码和无效码辅料依赖人工审批
      - name: 混合方案
        benefits:
          - 现有有效码可自动匹配
          - 无码或无法匹配辅料仍可走审批流程
          - 保留未来贴码增强能力
        costs:
          - 需要同时处理扫码和拍照申请两条流程
        risks:
          - 无码辅料的自动防错能力有限
    decision: 第一版采用方案 C 混合方案：现有有效码映射到内部代号后自动匹配；无码、无效码或未映射码走拍照、手动选择辅料和后台审批；自制二维码贴纸作为后续增强。
    reason_summary:
      - 用户明确选择方案 C
      - 不强制铺开贴码，减少现场成本
      - 兼容现有码和无码辅料，先验证完整流程
    conditions:
      - 现有码映射细节由 Q-014 进一步确认
    action: 将 Q-015 标记为 answered，并新增 BL-RECOG-001
    expected_result: 第一版同时支持现有码自动匹配和拍照申请审批
    reversal_plan: 该方案后续被自制二维码为主方案取代
