  - id: DEC-021
    title: 后台标签打印流程与新购标签打印机接入计划
    category: technical
    status: active
    authority: C
    user_approval: approved
    related_tasks: []
    related_business_logic:
      - BL-LABEL-002
      - BL-DEVICE-002
    context: 用户确认标签打印在后台完成，选择辅料、打印张数后由系统自动记录当前时间并发送打印指令；现场没有现成标签打印机，需要新购并配合系统接入。
    hypothesis: 打印界面只承担“选择辅料、选择张数、发送打印指令和记录打印时间”的主流程，具体打印机型号可在主流程设计完成后选型，不阻塞需求基线。
    options:
      - name: 新购可编程热敏标签打印机
        benefits:
          - 可通过驱动或指令批量打印二维码标签
          - 标签成本低
        costs:
          - 需要新购设备并验证驱动/指令集成
        risks:
          - 型号差异会影响集成方式
      - name: 使用现有普通打印机临时打印
        benefits:
          - 不需要立即采购
        costs:
          - 标签裁剪和耐用性差
        risks:
          - 二维码打印质量不稳定
      - name: 暂不打印，仅生成 PDF/图片
        benefits:
          - 主流程开发不依赖打印机
        costs:
          - 现场需要在别处打印
        risks:
          - 标签质量不可控
    decision: 第一版后台提供标签打印界面：选择辅料、选择打印张数、点击打印，系统自动记录当前打印时间 printedAt 并发送打印指令；标签打印后由操作员粘贴。打印机需要新购并配合系统接入，具体型号延后确定，不阻塞主流程。
    reason_summary:
      - 用户明确打印流程和打印机需新购
      - 标签打印属于独立硬件环节，可延后选型
      - 打印指令和记录应先按通用打印机接口/驱动抽象设计
    conditions:
      - 标签打印界面需支持选择辅料和打印张数
      - 打印记录保存打印人、打印时间、辅料、张数和 labelId
      - 生产日期录入方式由 Q-022 继续确认
    action: 将 Q-021 标记为 answered，新增 BL-LABEL-002 打印业务原子
    expected_result: 后台可完成辅料标签批量打印，打印机型号选型延后不阻塞主流程
    reversal_plan: 若新购打印机选型后接口特殊，可在打印适配层增加对应实现
    observation: 用户答复“打印机需要配置新的设备，功能需要和我们的系统配合”
    actual_result: 后台标签打印流程已纳入第一版业务基线，硬件选型延后
    outcome_status: successful
    lesson: null
