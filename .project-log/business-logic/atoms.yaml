    kind: rule
    domain: work-order
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-009"
    description: 工单必须按配方顺序完成全部辅料步骤；每个辅料都要有二维码扫码信息或图片记录，以及实际投放重量记录，全部完成后才允许提交工单完成。
    actors:
