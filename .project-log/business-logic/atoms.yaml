  - id: BL-AUTH-006
    title: 管理员通过后端哈希口令执行紧急密码恢复
    kind: flow
    domain: account
    status: active
    priority: critical
    risk: high
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-12 管理员紧急恢复方案确认"
    description: PC 登录框右上角隐藏热点在短时间内连续点击 10 次后打开管理员紧急恢复窗口；用户输入恢复口令，由后端比对 PBKDF2 哈希；恢复成功后系统生成随机临时密码，使旧管理员令牌失效，并要求使用临时密码登录后立即改密。
    actors:
      - 系统所有者或授权维护人员
      - 预置管理员账号
    trigger: 管理员密码遗忘且无法正常登录 PC 管理端
    preconditions:
      - 后端服务可访问
      - 本机后端配置中存在有效的恢复口令哈希
      - 恢复入口未被临时锁定
    inputs:
      - 恢复口令
    rule:
      statement: 恢复口令只提交到后端校验，前端和接口响应不返回恢复口令或哈希；校验成功时随机生成临时密码、设置强制首次改密并递增管理员认证版本；旧令牌立即失效；校验失败达到阈值时临时锁定账号恢复入口；失败、锁定和成功结果写审计日志且不得记录候选口令。
    outputs:
      - 一次性随机临时密码
      - 管理员密码更新结果
      - 旧会话失效结果
      - 恢复审计记录
    side_effects:
      - 管理员必须使用临时密码重新登录
      - 管理员首次登录后必须修改临时密码
    exceptions:
      - 后端未配置恢复口令哈希
      - 恢复口令错误
      - 连续错误达到锁定阈值
      - 预置管理员账号不存在
    failure_handling:
      - 未配置时禁用恢复
      - 错误时提示恢复口令不正确和剩余尝试次数
      - 达到阈值后按配置时间锁定
      - 数据库操作失败时不得返回临时密码
    invariants:
      - 恢复口令明文不得写入前端代码、仓库或审计日志
      - 隐藏点击次数不是安全凭证
      - 成功恢复后旧管理员令牌不得继续使用
      - 临时密码只显示一次并必须首次改密
      - 管理员恢复接口必须限流并审计
    acceptance:
      - id: AC-AUTH-006
        given: 管理员忘记密码且后端已配置有效恢复口令哈希
        when: 授权人员通过隐藏入口提交正确恢复口令
        then: 系统显示一次性临时密码，旧令牌失效，并允许使用临时密码登录后强制改密
        method: 后端回归测试 + PC 浏览器端到端验证
        evidence: EV-TASK-054-RECOVERY
        status: passed
    dependencies:
      - BL-AUTH-001
    baseline_refs:
      - REQ-001
    decision_refs:
      - DEC-033
    implementation_refs:
      - TASK-054
    test_refs:
      - pc/server/tests/test_auth.py::test_admin_recovery_resets_password_and_invalidates_old_session
      - pc/server/tests/test_auth.py::test_admin_recovery_is_rate_limited
      - /tmp/verify_admin_recovery_ui.py
    supersedes: []
    notes: 当前本地部署按用户指定恢复口令生成 PBKDF2 哈希；口令曾通过对话传递，正式投产前建议更换后只写入后端配置。
    created_at: "2026-09-12T13:05:00Z"
    updated_at: "2026-09-12T13:05:00Z"
    last_verified_at: "2026-09-12T13:05:00Z"
