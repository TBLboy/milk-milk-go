  - id: BL-WEIGH-006
    title: 第一版手动输入称重结果并保存电子秤读数照片
    kind: flow
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-007"
    description: 第一版不连接电子秤，操作员在平板端手动输入实际称量结果，并拍摄电子秤读数照片；系统必须将数字重量和读数照片一起保存，标记数据来源为“手动读数/manual”，记录操作员和时间，测试版不要求电脑端审批。
    actors:
      - 生产/称重操作员
    trigger: 操作员完成辅料称量并提交手动重量和电子秤读数照片
    preconditions:
      - 当前辅料步骤已进入称重
      - 操作员已确认当前实际称量结果
      - 操作员已拍摄能清楚显示电子秤读数的照片
    inputs:
      - 手动输入重量
      - 电子秤读数照片
      - 操作员身份
    rule:
      statement: 第一版以手动输入作为称重结果来源；数字重量和电子秤读数照片必须一起提交，数据来源标记为“manual”，并记录操作员、时间和输入重量；只有重量在允差范围内且读数照片已保存才允许完成。
    outputs:
      - 手动读数记录
      - 电子秤读数照片记录
    side_effects:
      - 工单称重记录同时保存数字重量和电子秤读数照片，并标记为手动读数
    exceptions:
      - 输入值非法或明显不合理
      - 未拍摄电子秤读数照片
      - 电子秤读数照片模糊或无法辨认
      - 操作员取消手动输入
    failure_handling:
      - 阻止提交并提示操作员重新输入或重新拍摄读数照片
    invariants:
      - 每条称重记录都能区分自动读数或手动读数
      - 第一版默认称重记录来源为 manual，未来自动读数作为新增来源而不覆盖历史记录
      - 每次手动称重记录必须同时包含数字重量、电子秤读数照片、操作员和操作时间
    acceptance:
      - id: AC-WEIGH-006
        given: 当前辅料步骤位于称重阶段
        when: 操作员手动输入实际称重结果、拍摄电子秤读数照片并确认
        then: 系统同时记录手动读数、读数照片、操作员和时间，并允许进入后续步骤
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-003
    baseline_refs: []
    decision_refs:
      - DEC-007
      - DEC-026
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 正式生产版本是否需要审批或二次确认，后续再确认；DEC-023 已确认第一版不接电子秤，重量来源为 manual；DEC-026 已确认数字重量和电子秤读数照片必须一起留痕。
