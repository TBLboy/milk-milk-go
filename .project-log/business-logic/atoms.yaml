      - 当前账号具有管理员权限
      - 配方所需的辅料已存在于辅料库
    inputs:
      - 产品名称
      - 产品图片（选填）
      - 所选辅料
      - 每吨成品所需辅料用量
    rule:
      statement: 产品信息包含产品名称、可选产品图片和配方；配方只能引用现有辅料库中的辅料并填写每吨用量；辅料尚未录入时，操作人员应先录入辅料再创建产品配方。
