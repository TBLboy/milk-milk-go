  - id: BL-WO-006
    title: 工单撤销需后台审批并保留历史记录
    kind: flow
    domain: work-order
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-12 用户反馈"
    description: 平板端可申请撤销工单，但必须经过后台审批；电脑后台也可以直接撤销工单。撤销后保留全部历史记录，不物理删除工单和证据；系统不再向用户提供新的删除操作。
    actors:
      - 生产/称重操作员
      - 电脑后台管理员
    trigger: 平板端申请撤销工单，或后台直接执行撤销
    preconditions:
      - 工单已存在
      - 操作员登录账号有效或后台管理员已登录
    inputs:
      - 工单
      - 申请账号或后台账号
      - 撤销原因
      - 审批结果
    rule:
      statement: 平板端提交的撤销申请必须先经后台审批；审批通过后工单生效为已撤销状态。后台可直接撤销，但必须记录原因和操作人；所有记录保留，不物理删除。系统不再提供新的删除申请或删除操作。
    outputs:
      - 撤销审批结果
      - 工单状态变更
    side_effects:
      - 工单不再作为可执行工单出现
      - 后台仍可查看完整历史记录和证据
    exceptions:
      - 后台驳回申请
      - 工单已完成
      - 工单已被撤销
    failure_handling:
