version: "0.2"
source_of_truth: true
atoms:
  - id: BL-WEIGH-001
    title: 根据产品配方和目标生产重量生成辅料称量清单
    kind: flow
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 业务澄清会话"
    description: 系统根据所选产品配方中的每吨辅料用量和目标生产重量，自动等比换算需要称取的辅料类型和重量。
    actors:
      - 生产计划人员
    trigger: 用户选择生产产品名称并输入目标生产重量
    preconditions:
      - 产品、配方和辅料主数据已在本系统内维护
      - 配方已按每吨成品录入辅料用量
    inputs:
      - 产品名称
      - 目标生产重量
      - 配方每吨辅料用量
    rule:
      statement: 系统按“配方每吨辅料用量 × 目标生产重量 ÷ 1000kg”计算每种辅料应称取的辅料类型和重量。
    outputs:
      - 应称辅料清单，包含辅料类型和应称重量
    side_effects: []
    exceptions:
      - 产品不存在
      - 配方不存在
      - 目标生产重量缺失或非法
    failure_handling:
      - 阻止进入称重流程并给出可修正提示
    invariants:
      - 同一产品、同一配方和同一目标重量的本次计算结果应一致
    acceptance:
      - id: AC-WEIGH-001
        given: 产品配方写明每吨需要辅料 A 10kg，目标生产重量为 2 吨
        when: 用户请求生成称量清单
        then: 系统输出辅料 A 应称 20kg
        method: null
        evidence: null
        status: not-verified
    dependencies: []
    baseline_refs: []
    decision_refs:
      - DEC-013
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: Q-013 已确认配方按每吨成品录入并等比换算。
    created_at: "2026-09-08T07:02:18Z"
    updated_at: "2026-09-08T10:45:46Z"
    last_verified_at: null
  - id: BL-WEIGH-002
    title: 称重前确认辅料类型
    kind: rule
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 业务澄清会话"
    description: 系统在称量前确认当前辅料与任务要求的辅料类型一致；第一版以本系统自制二维码为主，扫码解析 materialId 后与工单要求匹配；无本系统二维码或标签异常时走拍照申请审批。
    actors:
      - 生产/称重操作员
    trigger: 进入某一辅料的称重步骤
    preconditions:
      - 当前称重任务已生成
      - 辅料贴有本系统二维码，或已具备拍照申请条件
    inputs:
      - 本系统二维码识别值
      - materialId
      - labelId
      - 辅料包装图片
    rule:
      statement: 系统确认当前本系统二维码中的 materialId 与任务要求 requiredMaterialId 一致，或辅料已通过拍照申请审批后，才允许进入重量称量。
    outputs:
      - 辅料类型确认结果
    side_effects: []
    exceptions:
      - 本系统二维码缺失、污损或无法识别
      - 扫描到供应商二维码、普通条码或非本系统标签
      - 标签已作废或辅料已停用
    failure_handling:
      - 阻止继续称重并提示重新确认
      - 非本系统标签或标签异常时进入拍照申请审批
    invariants: []
    acceptance:
      - id: AC-WEIGH-002
        given: 当前称重任务要求辅料 MAT-00023，现场辅料贴有本系统二维码
        when: 操作员扫码解析得到 materialId=MAT-00023
        then: 系统确认类型正确并允许下一步称重
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-001
    baseline_refs: []
    decision_refs:
      - DEC-015
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: Q-016 已确认第一版采用自制二维码为主；无码/标签异常按 Q-005 拍照申请审批。
    created_at: "2026-09-08T07:02:18Z"
    updated_at: "2026-09-09T03:40:00Z"
    last_verified_at: null
  - id: BL-RECOG-001
    title: 第一版自制二维码为主辅料识别流程
    kind: flow
    domain: recognition
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-09 Q-016"
    description: 第一版以公司自制二维码作为辅料品类主身份；扫码解析本系统标签并读取不可变 materialId，与工单要求比较；非本系统标签、无码或标签异常时走拍照申请审批。
    actors:
      - 生产/称重操作员
      - 电脑后台管理员
    trigger: 操作员进入某一辅料的类型确认步骤
    preconditions:
      - 辅料主数据已维护内部代号
      - 当前工单包含该辅料步骤
    inputs:
      - 本系统二维码内容
      - materialId
      - labelId
      - 辅料包装图片
      - 后台审批结果
    rule:
      statement: 辅料识别以本系统自制二维码为主；扫码后以 materialId 与工单要求匹配，匹配成功才放行；供应商码不作为核心身份，标签异常或无码时走拍照申请审批。
    outputs:
      - 辅料类型确认通过结果
    side_effects:
      - 自动匹配和拍照审批过程均留痕
    exceptions:
      - 扫描到供应商二维码或普通条码
      - 标签已作废或辅料已停用
      - 后台驳回拍照申请
    failure_handling:
      - 非本系统二维码不直接放行；拍照申请被驳回时禁止称重
    invariants:
      - 未匹配或未审批通过的辅料不能进入称重
      - 制成品识别结果均关联不可变 materialId
    acceptance:
      - id: AC-RECOG-001
        given: 当前工单步骤要求 MAT-00023
        when: 扫码得到本系统二维码且 materialId 为 MAT-00023
        then: 系统确认辅料正确并允许进入称重
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-002
      - BL-WEIGH-005
    baseline_refs: []
    decision_refs:
      - DEC-015
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 供应商原码映射由 Q-014 推迟到后续增强；标签异常走拍照审批。
    created_at: "2026-09-09T02:53:43Z"
    updated_at: "2026-09-09T03:21:41Z"
    last_verified_at: null
  - id: BL-LABEL-001
    title: 自制二维码标签生成与标签记录
    kind: flow
    domain: labeling
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-09 Q-017 确认 + 外部设计说明"
    description: 第一版由电脑后台管理员生成和打印标签；系统以标签打印时间 printedAt 作为二维码标签日期，不录入实际生产日期；生成本系统二维码和唯一 labelId，后台保存标签记录，粘贴后扫码复核。
    actors:
      - 电脑后台管理员/标签打印人员
    trigger: 用户生成或打印自制辅料二维码标签
    preconditions:
      - 辅料主数据已存在且启用
      - 用户具备标签生成权限
    inputs:
      - materialId
      - 打印张数
      - 标签打印日期/printedAt
      - 打印人员
    rule:
      statement: 标签记录以 labelId 全局唯一；二维码包含 version、labelId、materialId、标签快照和标签打印日期 printedAt；后台标签记录是追溯数据源。第一版不校验实际生产日期和到期日期。
    outputs:
      - 自制二维码标签
      - 标签记录
    side_effects:
      - 后台保存打印人、打印时间、辅料快照和标签状态 ACTIVE/VOID
      - 粘贴后扫码复核记录留痕
    exceptions:
      - 辅料已停用
    failure_handling:
      - 阻止生成标签并提示管理员修正
    invariants:
      - labelId 全局唯一
      - materialId 不可变
      - 标签生成后后台保留完整记录
      - 二维码标签日期以 printedAt 为准
    acceptance:
      - id: AC-LABEL-001
        given: 管理员选择 MAT-00023 并打印标签
        when: 系统生成二维码标签
        then: 二维码包含 materialId 和标签打印日期，后台保存 labelId、打印人和打印时间
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-RECOG-001
    baseline_refs: []
    decision_refs:
      - DEC-015
      - DEC-016
      - DEC-022
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: Q-017 已确认标签流程；Q-022/DEC-022 已确认第一版不录入实际生产日期，以标签打印日期为准。
    created_at: "2026-09-09T03:21:41Z"
    updated_at: "2026-09-09T04:30:00Z"
    last_verified_at: null
  - id: BL-LABEL-002
    title: 后台选择辅料并批量打印自制二维码标签
    kind: flow
    domain: labeling
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-09 Q-021 标签打印流程"
    description: 管理员在后台标签打印界面选择辅料和打印张数，点击打印后系统自动读取当前时间作为打印时间，生成对应数量的标签记录并发送打印指令；打印完成后操作员拿标签粘贴。
    actors:
      - 电脑后台管理员/标签打印人员
    trigger: 管理员选择辅料并点击打印标签
    preconditions:
      - 辅料主数据已存在且启用
      - 后台电脑已连接可用标签打印机
    inputs:
      - materialId
      - 打印张数
      - 打印人员
      - 打印时间（系统自动读取）
    rule:
      statement: 系统按打印张数生成对应数量的 labelId 和标签记录，自动记录当前时间作为 printedAt（即标签日期），不录入实际生产日期，并向标签打印机发送打印指令；标签打印后由操作员粘贴。
    outputs:
      - 标签打印指令
      - 对应张数的标签记录
    side_effects:
      - 打印记录留痕，包含打印人、打印时间、辅料、张数
    exceptions:
      - 打印机离线或打印指令发送失败
      - 打印张数非法
    failure_handling:
      - 阻止打印并提示检查打印机或修正张数
      - 已生成但未成功打印的标签记录按失败处理，不视为已打印
    invariants:
      - 每张标签都有独立 labelId
      - printedAt 为系统当前时间，不由手工录入
      - 打印记录长期保存
    acceptance:
      - id: AC-LABEL-002
        given: 管理员选择 MAT-00023 并输入 10 张
        when: 管理员点击打印
        then: 系统生成 10 个 labelId 并向打印机发送打印指令，后台保存打印记录
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-LABEL-001
      - BL-DEVICE-002
    baseline_refs: []
    decision_refs:
      - DEC-021
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 打印机需新购并配合系统接入，具体型号延后确定；Q-022 已确认打印时不录入实际生产日期，以标签打印日期为准。
    created_at: "2026-09-09T04:20:00Z"
    updated_at: "2026-09-09T04:30:00Z"
    last_verified_at: null
  - id: BL-WEIGH-003
    title: 按配置允差校验称重结果
    kind: rule
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 业务澄清会话"
    description: 第一版由操作员提交称重结果和电子秤读数照片，系统以输入重量和辅料/配方配置的允差判断重量正确；重量达到目标加减允差且读数照片已保存才允许完成。
    actors:
      - 生产/称重操作员
    trigger: 辅料类型已确认后提交称重结果
    preconditions:
      - 当前辅料已配置允差，或系统存在默认允差
      - 操作员已获得并确认当前实际称量结果
      - 操作员已拍摄可辨认的电子秤读数照片
    inputs:
      - 操作员录入或未来自动读取的称重结果
      - 电子秤读数照片
      - 辅料/配方允差配置
    rule:
      statement: 系统按辅料/配方配置的允差判断提交重量；重量达到目标加减允差且电子秤读数照片已提交时允许标记完成，否则禁止完成。
    outputs:
      - 重量校验结果
    side_effects: []
    exceptions:
      - 输入值非法或明显不合理
      - 未提供可读取的电子秤读数照片
      - 未配置允差
    failure_handling:
      - 禁止记录为完成并提示操作员处理
      - 未配置允差时阻止称重并要求管理员在设置界面配置
    invariants: []
    acceptance:
      - id: AC-WEIGH-003
        given: 目标辅料重量为 500g，允许差为 ±5g
        when: 操作员提交 497g 作为实际称重结果，并上传可辨认的电子秤读数照片
        then: 系统允许该步骤完成并同时保存数字重量和读数照片
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-002
    baseline_refs: []
    decision_refs:
      - DEC-005
      - DEC-026
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: Q-006 已确认允差按辅料/配方配置，参数可在设置界面调整；DEC-023 已确认第一版不接电子秤，重量以手动输入为主；DEC-026 已确认手动称重必须同时保存电子秤读数照片。
    created_at: "2026-09-08T07:02:18Z"
    updated_at: "2026-09-09T06:40:00Z"
    last_verified_at: null
  - id: BL-WEIGH-004
    title: 类型或重量不匹配时拦截错误结果
    kind: constraint
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 业务澄清会话"
    description: 系统必须防止把类型错误或重量不符的辅料称重步骤记录为成功。
    actors:
      - 生产/称重操作员
    trigger: 用户尝试提交类型未确认或重量不达标的称重结果
    preconditions: []
    inputs: []
    rule:
      statement: 类型或重量不符合任务要求的称重步骤不得记录为成功。
    outputs:
      - 错误提示
    side_effects: []
    exceptions: []
    failure_handling:
      - 明确提示失败原因，并阻止进入下一辅料或完成整批任务
    invariants:
      - 没有类型确认记录且重量达标记录的步骤不能视为完成
    acceptance:
      - id: AC-WEIGH-004
        given: 当前辅料类型错误或重量未达标
        when: 操作员尝试继续或完成
        then: 系统拒绝该结果并提示错误
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-002
      - BL-WEIGH-003
    baseline_refs: []
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 用户首轮已明确系统核心目标是防止辅料类型和重量错误，因此拦截错误结果纳入确认基线；具体拦截方式和错误处理仍可在实现前细化。
    created_at: "2026-09-08T07:02:18Z"
    updated_at: "2026-09-09T04:40:00Z"
    last_verified_at: null
  - id: BL-WEIGH-005
    title: 无码或无自动识别辅料先审批后称重
    kind: flow
    domain: weighing
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-005"
    description: 第一版测试版中，辅料无法通过二维码自动确认时，操作员在平板端拍照并提交申请，电脑端审批通过后，该辅料才允许称重。
    actors:
      - 生产/称重操作员（平板端）
      - 电脑端审批人
    trigger: 当前辅料无二维码、二维码无法识别或识别不匹配
    preconditions:
      - 当前称重工单已生成
      - 当前辅料步骤未完成
      - 操作员已拍摄或上传辅料包装图片
    inputs:
      - 辅料包装图片
      - 放行申请理由
      - 审批结果
    rule:
      statement: 没有二维码自动识别结果时，类型确认必须经过“已提交申请 -> 已审批通过”；审批通过前不得进入重量称量。
    outputs:
      - 类型确认通过结果
      - 申请与审批留痕
    side_effects:
      - 工单记录申请时间、申请理由、图片证据、审批人、审批时间和审批结论
    exceptions:
      - 审批驳回
      - 申请材料不完整
      - 申请撤销
    failure_handling:
      - 审批驳回或材料不完整时阻止称重，并允许操作员补充材料或重新申请
    invariants:
      - 审批通过前该辅料不能标记为类型已确认
      - 每次申请都保留申请人和审批人记录
    acceptance:
      - id: AC-WEIGH-005
        given: 无码辅料已拍照并提交申请
        when: 电脑端审批人通过申请
        then: 系统允许该辅料进入称重，并保存申请与审批证据
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-WEIGH-002
      - BL-WEIGH-004
    baseline_refs: []
    decision_refs:
      - DEC-004
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 真实生产版本的无码放行策略待后续确认，暂不影响第一版测试版基线。
    created_at: "2026-09-08T09:17:09Z"
    updated_at: "2026-09-08T09:17:09Z"
    last_verified_at: null
  - id: BL-SETTINGS-001
    title: 允差与稳定条件可由用户在设置界面维护
    kind: flow
    domain: settings
    status: active
    priority: high
    risk: low
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-006"
    description: 系统提供设置界面，允许用户自行调整全局默认允差和按辅料或配方的允差覆盖；稳定时间等称重参数保留给后续电子秤接入场景。
    actors:
      - 系统用户/管理员
    trigger: 用户修改称重允差或稳定参数
    preconditions:
