      - 所有辅料步骤已按顺序执行
    inputs:
      - 每个辅料的类型确认证据
      - 每个辅料的实际重量记录
    rule:
      statement: 只要有一个辅料步骤未完成、未按顺序完成或证据不完整，工单就不能提交完成。
    outputs:
