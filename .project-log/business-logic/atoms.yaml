  - id: BL-WO-003
    title: 平板端查看工单状态并申请接管
    kind: flow
    domain: work-order
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-008"
    description: 平板端用户可查看其他工单的状态和绑定账号，并申请接管；后台审批通过后，工单重新绑定到申请账号。
    actors:
      - 生产/称重操作员
      - 电脑后台管理员
    trigger: 用户申请接管一个非本人绑定的工单
    preconditions:
      - 工单已存在
      - 用户不是当前绑定账号
