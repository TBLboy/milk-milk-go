  - id: BL-EVID-001
    title: 生产证据照片仅允许现场拍摄并添加操作水印
    kind: rule
    domain: evidence
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-12 统一现场拍照证据要求"
    description: 除头像和辅料主数据图片等非生产业务图片外，类型确认、重量确认及其他生产步骤需要上传的证据照片只能由平板相机现场拍摄，不能从系统相册选择；类型确认使用统一的“拍照扫码”动作，系统从同一张现场照片解析二维码并添加操作水印。
    actors:
      - 生产/称重操作员
    trigger: 操作员执行需要照片证据的类型确认或重量确认步骤
    preconditions:
      - 当前工单步骤处于需要现场拍照的业务阶段
      - 平板已获得相机权限
    inputs:
      - 现场拍摄照片
      - 操作员身份
      - 工单和步骤信息
      - 类型确认步骤中的二维码
    rule:
      statement: 生产流程证据只能通过应用内相机现场拍摄；类型确认统一为“拍照扫码”，从拍摄照片解析二维码并将照片绑定为类型确认证据；重量确认必须拍摄电子秤读数照片后才能提交；系统在照片上添加操作员、拍摄时间、工单和步骤/辅料水印后上传后台。
    outputs:
      - 带操作水印的现场照片证据
      - 类型确认二维码解析结果
      - 重量确认电子秤读数照片
    side_effects:
      - 类型确认照片、二维码匹配结果、称重照片和操作人员信息共同留痕
    exceptions:
      - 相机权限被拒绝
      - 照片拍摄或处理失败
      - 拍摄照片中未识别到二维码
      - 重量确认未拍摄电子秤读数照片
    failure_handling:
      - 相机权限或拍照失败时阻止提交并提示重试
      - 类型确认未识别到二维码时允许填写理由后提交后台拍照审批
      - 重量确认缺少现场照片时禁用提交
    invariants:
      - 生产流程证据照片不得来自系统相册
      - 类型确认的二维码解析和证据照片来自同一次现场拍摄
      - 所有生产流程证据照片至少带有操作员、拍摄时间、工单和步骤/辅料水印
    acceptance:
      - id: AC-EVID-001
        given: 当前步骤需要进行类型确认或重量确认
        when: 操作员提交该步骤
        then: 系统只接受应用内相机现场拍摄的证据照片，并在类型确认时从该照片解析二维码、在重量确认时要求电子秤读数照片
        method: null
        evidence: null
        status: not-verified
    dependencies:
      - BL-RECOG-001
      - BL-WEIGH-002
      - BL-WEIGH-006
    baseline_refs: []
    decision_refs: []
    implementation_refs: []
    test_refs: []
    supersedes: []
    notes: 头像和辅料主数据图片不属于生产流程证据，仍允许在平板相册选择；生产流程照片是否来自真实相机最终仍需真机验收。
    created_at: "2026-09-12T09:30:00Z"
    updated_at: "2026-09-12T09:30:00Z"
    last_verified_at: null
  - id: BL-WO-001
    title: 工单与操作员账号绑定
    kind: rule
    domain: work-order
    status: active
    priority: critical
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-08 Q-008"
    description: 工单通过后台审批或后台分配后绑定到一个操作员账号；只有绑定的账号可以操作该工单。
    actors:
      - 生产/称重操作员
    trigger: 工单被后台审批通过或由电脑后台完成绑定
    preconditions:
      - 工单已创建
      - 待绑定账号有效
    inputs:
      - 工单
      - 操作员账号
    rule:
      statement: 每个工单同一时间最多绑定一个操作员账号；只有绑定账号可以操作该工单。
    outputs:
      - 工单绑定状态
    side_effects:
      - 非绑定账号不能执行该工单的称重步骤
    exceptions:
      - 账号不存在或不可用
      - 工单已绑定其他账号
    failure_handling:
      - 拒绝绑定并提示后台处理
    invariants:
      - 同一工单同一时间最多有一个绑定操作员账号
      - 绑定变更需要后台审批并保留记录
