    description: 管理员在电脑后台或平板端创建和维护产品信息及配方；配方行只能从现有辅料库选择辅料，并填写每吨成品所需用量；产品图片为可选资料，可在电脑端或平板端选择、预览、更换和删除。
    actors:
      - 电脑后台管理员
      - 平板端管理员
    trigger: 管理员创建或修改产品配方
