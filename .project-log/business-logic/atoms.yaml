      - 工单
      - 申请账号
      - 后台审批结果
    rule:
      statement: 接管申请必须先经过后台审批；审批通过后工单绑定账号变更为申请账号，审批不通过则绑定关系不变。
    outputs:
      - 接管审批结果
    side_effects:
      - 工单绑定账号发生变更
    exceptions:
