  - id: BL-DATA-003
    title: 辅料主数据录入与包装图片管理
    kind: flow
    domain: master-data
    status: active
    priority: high
    risk: medium
    authority: user-confirmed
    source:
      type: user-statement
      reference: "2026-09-09 辅料与产品配方录入细节"
    description: 管理员可在电脑后台或平板端创建和维护辅料信息；辅料信息包含系统自动生成的 materialId、公司内部代号、中文名称、选填英文名称、默认保质期和启用状态，并可保存多张包装外观图片；电脑端从本地文件选择图片，平板端从相册选择或直接拍摄。
    actors:
      - 电脑后台管理员
      - 平板端管理员
    trigger: 管理员创建或修改辅料主数据
    preconditions:
      - 当前账号具有管理员权限
    inputs:
      - 中文名称
      - 英文名称（选填）
      - 公司内部代号
      - 默认保质期
      - 多张辅料包装图片
    rule:
      statement: 辅料主数据创建和编辑仅管理员可操作；materialCode、中文名称和默认保质期必填，英文名称选填；系统保存辅料身份字段，并支持电脑端选择本地图片、平板端从相册选择或拍摄多张包装图片。
    outputs:
      - 可供产品配方、二维码标签和称重流程使用的辅料主数据及图片
    side_effects:
      - 辅料图片和修改历史长期保存
    exceptions:
      - 非管理员尝试进入辅料管理
      - 内部代号或必填字段缺失
      - 图片格式或大小不合法
    failure_handling:
      - 非管理员看不到辅料管理入口
      - 必填字段或图片不符合要求时阻止保存并提示
    invariants:
      - materialId 自动生成且不可变
      - 公司内部代号在启用辅料中保持唯一
      - 中文名称和默认保质期必填，英文名称选填
      - 一种辅料可关联多张包装图片
    acceptance:
      - id: AC-DATA-003
        given: 管理员在平板端选择拍摄辅料包装并录入中文名称、英文名称/代号、内部代号和保质期
        when: 管理员保存辅料
        then: 辅料进入辅料库，多张图片可供后续查看和辅助识别
