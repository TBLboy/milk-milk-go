      - 阻止保存并提示先增加辅料或修正用量
    invariants:
      - 配方引用的每个辅料都必须存在于辅料库
      - 配方中的用量按每吨成品保存，后续按目标生产重量等比换算
      - 产品图片为可选资料，不参与配方数量计算
