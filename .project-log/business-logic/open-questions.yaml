  - id: Q-015
    title: 第一版辅料类型识别采用贴码、现有码还是拍照申请方案
    status: superseded
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-002
      - BL-WEIGH-005
      - BL-DATA-001
    related_tasks: []
    context: 客户反馈包装和码型不统一，现有码不能覆盖全部辅料，且供应商二维码是溯源信息。需要确定第一版采用自制贴码、利用现有码加拍照申请，还是混合方案。
    recommendation: 第一版采用混合方案：能有效扫描的现有码在后台映射到内部代号后自动匹配；无码、无效码或未映射的码走拍照 + 手动选择辅料 + 后台审批。自制二维码贴纸作为后续增强，不在第一版强制铺开。
    alternatives:
      - 自制二维码贴纸：所有辅料统一可扫码，但需要打印、粘贴，存在贴错风险。
      - 现有码 + 拍照审批：不增加贴码工作量，但有效码覆盖不足，人工确认会多一些。
      - 包装图片模型自动识别：最终目标更彻底，但第一版暂不做。
    answer: 原确认采用方案 C 混合方案，后续根据现场码型混乱情况调整为“第一版自制二维码为主”；该方案被 Q-016 取代。
