    context: 客户可能无法保证现场电脑的 IP 永远不变。HTTPS 证书的信任链可以由 App 内置根 CA 固定，但标准证书校验仍要求证书 SAN 与平板实际访问的 IP 或主机名一致。
    recommendation: 优先让路由器或 DHCP 服务按电脑网卡 MAC 配置地址保留，电脑继续使用 DHCP，但每次获得同一个 IP；如果网络支持内网 DNS，则使用稳定的 `milkweigh` 类主机名并给证书配置 DNS SAN。两者都不可用时，提供 IP 变化后重新签发服务器叶子证书的本地工具。
    alternatives:
      - DHCP 地址保留：配置最简单，仍可能出现网络管理员更换设备或路由器。
      - 内网主机名或本地 DNS：证书不随 IP 变化失效，但依赖网络设备支持。
      - IP 变化后重新签发叶子证书：根 CA 和 App 不需要变化，但需要现场管理员执行证书更新。
      - 继续使用 HTTP：不需要证书，但必须接受局域网明文传输和冒用风险。
    answer: 当前版本使用 HTTP，不依赖服务器证书，因此暂不要求 DHCP 地址保留、内网主机名或证书重签工具。平板每次只需填写当前主机 IP 即可；未来升级 HTTPS 时再重新确认地址稳定性。
