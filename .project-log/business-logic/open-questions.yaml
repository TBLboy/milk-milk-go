      - 包装图片模型自动识别：最终目标更彻底，但第一版不做。
    answer: 第一版采用公司自制二维码作为主识别方案，供应商原有二维码/条码不作为核心身份；无码、标签异常或无法识别时走拍照申请审批。具体标签字段、打印权限和复核流程由 Q-017 继续确认。
