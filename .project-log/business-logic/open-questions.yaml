  - id: Q-023
    title: 公司内部 WiFi 下是否要求 HTTPS
    status: answered
    authority: C
    impact: high
    uncertainty: medium
    rework_cost: medium
    related_business_logic:
      - BL-DEVICE-002
      - BL-AUTH-001
      - BL-EVID-001
    related_tasks: []
    context: 用户明确计划使用公司内部 WiFi，而不是让平板连接临时热点或依赖公网。当前系统使用 HTTP，登录令牌、头像、电话、身份证资料、工单、审批和现场照片都会在局域网中传输。内部 WiFi 是网络范围，不等于已确认接受明文传输风险。
    recommendation: 优先评估内部 CA 或安装程序生成受平板信任证书的 HTTPS 方案；如果因 Android 证书信任和现场维护成本决定继续使用 HTTP，应由客户确认该 WiFi 为受控生产网络并形成风险接受记录。
    alternatives:
      - 使用 HTTPS：保护令牌和个人信息，但需要证书签发、分发和续期方案。
      - 使用受控内部 WiFi 下的 HTTP：部署简单，但必须接受局域网监听和冒用风险。
      - 先 Demo 使用 HTTP，正式投产前再升级 HTTPS：Demo 成本最低，但需要明确正式版上线门槛。
    answer: 当前版本继续使用公司内部局域网 WiFi 下的 HTTP，不引入 HTTPS、内部 CA、证书分发和证书续期；平板只需连接 WiFi 并在 App 中填写主机 IP。系统仍需明确区分这是当前简化交付方案，未来如对安全要求提高可重新评估 HTTPS。
