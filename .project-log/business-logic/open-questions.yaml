  - id: Q-017
    title: 自制二维码标签的生成、打印、粘贴复核流程
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-LABEL-001
      - BL-RECOG-001
      - BL-WEIGH-005
    related_tasks: []
    context: 第一版已确认以公司自制二维码为主；外部设计说明建议由指定权限人员生成标签，打印时录入生产日期，系统自动带出保质期并计算到期日期，记录 labelId、打印人、打印时间和辅料快照，粘贴后扫码复核。这些操作细节尚未由客户确认。
    recommendation: 第一版标签生成/打印放在电脑后台，由管理员操作；打印时至少录入实际生产日期，其余从辅料主数据带出；每次打印生成独立 labelId，同一种辅料可共用 materialId；标签状态保留 ACTIVE/VOID；粘贴后建议扫码复核；标签未生成、污损或扫描异常仍走拍照申请审批。
    alternatives:
      - 后台管理员打印并扫码复核：可控性好，可减少贴错风险，推荐。
      - 允许平板操作员直接打印：现场更方便，但权限边界弱，贴错风险更依赖复核。
      - 只生成二维码图片由客户自行打印：省打印设备，但打印质量和标签追溯较弱。
    answer: 第一版按推荐流程执行：标签生成/打印放在电脑后台由管理员操作；打印时录入实际生产日期，保质期从辅料主数据自动带出，到期日期按“生产日期 + 保质期”计算；每次打印生成独立 labelId，同一种辅料可共用 materialId；标签状态保留 ACTIVE/VOID；粘贴后扫码复核；标签未生成、污损或扫描异常仍走拍照申请审批。
