    alternatives:
      - 专用办公电脑/笔记本作为后端：稳定、易维护、便于接电子秤和打印机，推荐。
      - 使用现有 Q1S 收款机作为后端：省一台电脑，但性能、系统兼容和串口/打印机接入需要现场验证。
