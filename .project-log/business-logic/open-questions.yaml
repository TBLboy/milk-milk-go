version: "0.2.1"
questions:
  - id: Q-001
    title: 本系统在客户现有 IT 环境中的交付边界
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-001
      - BL-WEIGH-002
      - BL-WEIGH-003
    related_tasks: []
    context: 客户有金蝶系统，但其作用、接口和辅料防错能力均未知；系统边界会直接决定配方数据来源、部署方式和结果回写方案。
    recommendation: 按独立系统交付，不连接金蝶；产品、配方和辅料主数据由本系统维护或导入。
    alternatives:
      - 作为金蝶内部子系统开发，需要先完成金蝶平台能力调研。
      - 嵌入现有金蝶流程，需要先确认开发方式和账号权限。
    answer: 独立系统，不连接金蝶；范围聚焦辅料类型识别和重量校验，简单好上手即可。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T07:02:18Z"
    answered_at: "2026-09-08T07:59:53Z"
  - id: Q-002
    title: 独立系统内的产品、配方和辅料主数据来源与维护方式
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-SCOPE-001
      - BL-WEIGH-001
    related_tasks: []
    context: 系统已确认不连接金蝶，因此产品、配方和辅料主数据必须在本系统内维护或导入，否则无法自动生成称量清单。
    recommendation: 由本系统自带基础数据维护功能，先支持手工录入和 Excel 模板导入；客户提供现有配方表用于初始化。
    alternatives:
      - 完全手工录入，不提供导入，适合数据量很少的场景，但初始化成本高。
      - 只保留 SQL 或文件级预置数据，操作员日常可维护性低。
    answer: 由用户在本系统内自行录入和维护产品信息、产品配料信息、辅料信息；系统提供相应的管理功能。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T07:59:53Z"
    answered_at: "2026-09-08T08:05:12Z"
  - id: Q-003
    title: 现场辅料识别和系统操作使用什么设备
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: medium
    related_business_logic:
      - BL-SCOPE-001
      - BL-WEIGH-002
    related_tasks: []
    context: 客户没有扫码枪，辅料通常有二维码且可能存在无码辅料；设备形态决定扫码、拍照确认和称重操作方式。
    recommendation: MVP 先使用手机或平板摄像头扫码/拍照，不额外采购扫码枪；无码辅料保留拍照或手动选择辅料类型兜底。
    alternatives:
      - 使用电脑配合扫码枪，需要采购硬件并依赖现场 PC。
      - 使用手机/平板配合扫码枪，操作体验好但增加硬件成本。
    answer: 首选平板，次选扫码枪；本轮 MVP 先按平板实现。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T08:05:12Z"
    answered_at: "2026-09-08T08:10:16Z"
  - id: Q-004
    title: 电子秤重量数据如何进入系统
    status: answered
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-DEVICE-001
      - BL-WEIGH-003
    related_tasks: []
    context: 平板设备已确定，客户提供现有硬件为 ENTOAM 映拓 Qy-C126，配套收款机 Q1S（主板 Gm-J6412D16-V2E）。公开资料显示映拓计价秤可通过串口/默认 COM2 实时取重，同系列 QY-A126 也有第三方抓包证据，但未找到 Qy-C126 官方手册，实物端口和协议状态仍需核实。需要向客户确认三项：1. 现有电子秤是否支持外部连接读取实时称重数据；2. 如不支持，客户是否有必须连接的硬性需求，是否可以购买支持连接的新电子秤；3. 如允许不连接，重量确认如何设计。
    recommendation: 先向客户确认这三项；实现上按“自动读取为主、手动确认兜底”准备，但最终以客户答案为准。
    alternatives:
      - 现有电子秤支持外部连接：系统自动读取实时重量，防错效果最好。
      - 现有电子秤不支持但客户必须连接：评估转接方案或采购支持连接的新电子秤。
      - 客户允许不连接电子秤：设计人工输入或确认秤面读数的流程，并明确如何防止误确认。
    answer: 第一版不连接电子秤，称重结果由操作员在平板手动输入并标记为“手动读数”；电子秤串口/网络接入、协议和是否需要换新秤留到后续版本再研究和验证。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T08:10:16Z"
    answered_at: "2026-09-09T06:00:00Z"
  - id: Q-005
    title: 第一版无二维码辅料的申请、放行与称重时序
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-002
      - BL-WEIGH-004
    related_tasks: []
    context: 第一版不做模型自动识别，无二维码辅料只能靠拍照和人工确认。需要明确“拍照申请 -> 放行 -> 称重”的先后顺序，否则工单状态、审批角色和证据留存无法定稿。
    recommendation: 无码辅料先拍照并提交申请，审批通过后才允许继续称重；审批记录与证据存入工单。若现场希望不中断生产，可改为“拍照 + 必填原因立即放行并留痕”，但防错强度会降低。
    alternatives:
      - 先审批后称重：类型确认更严格，但现场可能需要等待审批人。
      - 先称重后补审批：生产不中断，但防错和追责能力下降。
      - 无审批、仅拍照确认：MVP 最简单，但不满足“申请放行”的业务意图。
    answer: 第一版测试版采用先审批后称重：平板端拍照申请，电脑端马上审批，审批通过后才能继续称重；真实生产版本的无码放行策略后续再确认。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:12:26Z"
    answered_at: "2026-09-08T09:17:09Z"
  - id: Q-006
    title: 称重完成时如何判定重量正确
    status: answered
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-003
      - BL-WEIGH-004
    related_tasks: []
    context: 重量正确是第一版防错核心，但当前只确认了“电子秤读数达标”，没有定义允差、稳定条件和完成时机。这会影响主数据字段、称重校验和异常处理。
    recommendation: 按每条辅料/配方配置允差，支持固定克重和百分比；测试版先使用统一默认值（如 ±5g 或 ±1%），达到目标 ± 允差且电子秤读数稳定后允许完成。
    alternatives:
      - 按辅料/配方配置允差：最贴合实际，但主数据和配置界面略多一点。
      - 全系统统一允差：实现最简单，但大重量和小重量辅料可能过严或过松。
      - 不允许任何偏差：防错最严，但现场难以操作，可能频繁阻塞。
    answer: 按第一种方案：每条辅料/配方可配置允差；测试版先使用统一默认值；允差、稳定条件等参数放在设置界面，允许用户自行调整。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:17:09Z"
    answered_at: "2026-09-08T09:23:17Z"
  - id: Q-007
    title: 电子秤离线或读数异常时如何确认重量
    status: answered
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-003
      - BL-WEIGH-004
    related_tasks: []
    context: 已确认连接失败时支持手动输入当前秤面读数，但未明确手动读数的防错规则。若手动输入可直接完成，电子秤防错可能被绕过；若要求审批，电子秤断线时流程会更慢。
    recommendation: 第一版测试允许操作员手动输入，但系统必须明确标记“手动读数”，记录操作员、时间和读数；测试版暂不做电脑端审批，正式版再决定是否需要审批或二次确认。
    alternatives:
      - 手动输入直接允许并留痕：流程简单，测试能继续，但无法完全证明重量正确。
      - 手动输入需电脑端审批：更严格，但电子秤断线时会更慢。
      - 电子秤离线时禁止称重：防错最强，但失去手动兜底能力。
    answer: 第一版测试按建议：电子秤离线或读数异常时允许手动输入，系统明确标记为“手动读数”并记录操作员、时间和读数；测试版不做电脑端审批，正式版规则后续再定。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:23:17Z"
    answered_at: "2026-09-08T09:27:42Z"
  - id: Q-008
    title: 工单创建、绑定账号与接管规则
    status: answered
    authority: C
    impact: high
    uncertainty: medium
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-001
      - BL-WEIGH-002
    related_tasks: []
    context: 系统支持多台平板同时工作，但未确认工单如何决定“谁可以操作”。用户提出了工单绑定账号和后台审批交接的方案，需要将其纳入业务基线。
    recommendation: 工单绑定到一个操作员账号，只有该账号可操作；平板创建工单要后台审批后才生效；其他账号可申请接管，由后台审批；后台也可创建工单并指定绑定账号。
    alternatives:
      - 平板创建/后台审批/账号绑定：业务流程清晰，适合当前现场组织方式。
      - 后台集中创建和分配：后台负担更重，不符合平板为主的业务习惯。
      - 工单不绑定账号、自由认领：实现简单，但责任和状态不清。
    answer: 平板是主要业务操作端；操作员在平板登录后创建工单，后台审批通过后工单绑定到该账号，只有该账号可操作。平板可查看其他工单状态和绑定账号，并可申请接管，后台审批通过后归申请人操作。电脑后台主要做审批、工单创建/分配和数据管理。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:27:42Z"
    answered_at: "2026-09-08T09:44:18Z"
  - id: Q-009
    title: 进行中工单的完成、撤销与作废规则
    status: answered
    authority: C
    impact: high
    uncertainty: medium
    rework_cost: high
    related_business_logic:
      - BL-WO-001
      - BL-WO-002
    related_tasks: []
    context: 工单绑定账号和后台审批的流转已确认，但还没有定义操作员如何提交完成，以及创建错误、无法继续或重复创建时如何处理。
    recommendation: 工单必须按顺序完成所有辅料步骤后才能提交完成；每个辅料步骤保留二维码/图片证据和实际重量记录。撤销/删除由平板端申请，后台审批通过后才生效；后台也可以直接撤销/删除。
    alternatives:
      - 后台可作废，操作员不可自行作废：责任边界清楚，异常工单不会失控。
      - 绑定操作员可自行作废并留原因：现场灵活，但可能掩盖未完成或错误操作。
      - 不允许作废，只能完成：状态最简单，但错误工单无法处理。
    answer: 工单按顺序完成全部辅料步骤后才可提交完成；每个辅料保留二维码扫码信息或图片记录以及实际投放重量记录。平板端可申请撤销/删除，需后台审批；后台也可以撤销/删除工单。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:44:18Z"
    answered_at: "2026-09-08T09:52:19Z"
  - id: Q-010
    title: 工单撤销/删除后是否保留历史记录
    status: answered
    authority: C
    impact: high
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WO-006
    related_tasks: []
    context: 用户确认平板可申请撤销/删除、后台可撤销/删除，但没有说明删除后是否仍保留扫码、图片、重量等证据。删除策略会直接影响追溯能力和数据安全。
    recommendation: 第一版采用“撤销/作废”而不是物理删除：工单在平板端不再显示，但后台保留完整记录和被撤销状态；这样扫码、图片和重量证据不会被误删。
    alternatives:
      - 撤销/作废并保留记录：可追溯，安全，推荐。
      - 允许物理删除：界面更干净，但证据会永久丢失。
      - 显示作废但隐藏证据：兼顾展示与追溯，需要额外权限控制。
    answer: 删除也要保留记录；第一版采用撤销/作废和逻辑删除，完整工单、扫码/图片、重量、操作员和审批记录均保留。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:52:19Z"
    answered_at: "2026-09-08T09:58:19Z"
  - id: Q-011
    title: 电脑后台账号和权限如何划分
    status: answered
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WO-001
      - BL-WO-006
      - BL-SETTINGS-001
    related_tasks: []
    context: 已确认后台可审批、创建/分配工单、撤销/删除工单、管理数据和设置，但还没有定义哪些账号能使用后台，以及操作员账号是否可能获得后台权限。
    recommendation: 平板端注册的账号均为普通操作员账号，不能进入后台；电脑后台管理员账号为预置账号，可以审批和管理，也可以在后台创建和管理普通账号。管理员账号不能通过平板注册获得。
    alternatives:
      - 区分操作员和管理员：责任边界清晰，适合第一版。
      - 所有人同一权限：实现简单，但任何账号都可能审批或改设置。
      - 增加审批员/管理员/操作员三类角色：更细分，但第一版复杂度更高。
    answer: 平板创建的账户都是普通账户；后台账户属于管理员账户，管理员账户为预置账号；后台可以创建和管理普通账户。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T09:58:19Z"
    answered_at: "2026-09-08T10:32:39Z"
  - id: Q-012
    title: 称重记录和证据需要保存多久
    status: answered
    authority: C
    impact: medium
    uncertainty: medium
    rework_cost: medium
    related_business_logic:
      - BL-WEIGH-003
      - BL-WO-005
    related_tasks: []
    context: 已确认删除也保留记录，但还没有定义应保留多久。若长期累积，图片和称重记录会影响存储、导出和备份策略。
    recommendation: 第一版先不限制保存时长，默认长期保留；后续如果存储压力大，再在设置界面增加归档/清理策略，而不是直接物理删除。
    alternatives:
      - 长期保留：可随时追溯，第一版实现最简单。
      - 按固定周期保留：例如保留 N 个月或 N 年，需要定义清理策略。
      - 只保留生产追溯周期：节省存储，但需要客户确认周期。
    answer: 长期保存；第一版不限制保存时长，后续如需归档或清理再单独制定策略。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T10:32:39Z"
    answered_at: "2026-09-08T10:40:05Z"
  - id: Q-013
    title: 配方中辅料重量如何配置和换算
    status: answered
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-001
    related_tasks: []
    context: 系统需要根据产品配方和目标生产重量计算每种辅料的应称重量，但还没有确认客户如何录入配方，以及系统按什么规则把配方换算到实际生产重量。
    recommendation: 配方中的每种辅料按一个标准生产量（如每 1000kg 成品）录入重量；系统按“目标生产重量 / 标准生产量”等比换算得到应称重量。这样 1 吨、2 吨或任意生产量都能自动计算。
    alternatives:
      - 按单位产量录入并等比换算：灵活，适合不同生产量。
      - 按固定批次录入绝对重量：实现简单，但每次只能针对该批次重量。
      - 配方存百分比/比例：需要额外定义基准产量和换算规则。
    answer: 配方按“每吨成品需要多少辅料”录入；系统按目标生产重量除以 1000kg 等比换算得到应称重量。
    source_refs:
      - user-statement/2026-09-08
    created_at: "2026-09-08T10:40:05Z"
    answered_at: "2026-09-08T10:45:46Z"
  - id: Q-014
    title: 二维码/条码如何映射到辅料内部代号
    status: deferred
    authority: C
    impact: critical
    uncertainty: high
    rework_cost: high
    related_business_logic:
      - BL-WEIGH-002
      - BL-DATA-001
    related_tasks: []
    context: 现场包装不统一，有塑料桶、纸箱、蛇皮袋；部分有码、部分无码；条码有的扫描无效；二维码多为辅料供应商自己的产品溯源信息；公司内部使用 A1/E2 这类代号。第一版扫码确认需要把这些码映射到内部辅料代号。
    recommendation: 供应商原有码映射不作为第一版核心；第一版采用公司自制二维码作为主身份，供应商码后续如需增强再评估。
    alternatives:
      - 后台维护二维码值并精确匹配：灵活，兼容现有标签内容。
      - 二维码内容必须按规范编码：更稳定，但需要现场标签符合规范。
      - 不做二维码匹配，只拍照留档：第一版无法实现自动类型确认。
    answer: 第一版不再解析供应商原有二维码/条码作为核心识别；自制二维码成为扫码主方案，供应商码映射推迟到后续增强。
