    constraints:
      - 独立系统且不连接金蝶
      - 平板是现场首选操作设备，扫码枪不作为第一版阻塞项
      - 第一版识别以公司自制二维码为主，materialId 是核心匹配字段
      - 产品配方按每吨辅料用量录入并等比换算
      - 无码或标签异常先审批后称重
      - 称重允差放在设置界面，允许用户调整；稳定参数留待后续电子秤接入时再启用
      - 第一版手动称重必须同时保存数字重量和电子秤读数照片
      - 生产流程证据照片必须由应用内相机现场拍摄并带操作水印，不能从系统相册选择
      - 工单必须按顺序完成全部辅料步骤，且证据完整
      - 撤销后保留全部历史记录；仅兼容展示历史已删除数据，不再提供新的删除操作
      - 辅料和产品配方录入仅管理员可操作
      - 二维码标签日期以标签打印日期 printedAt 为准，不管理实际生产日期
      - 当前版本使用公司内部 WiFi 下的 HTTP，不引入 HTTPS、内部 CA 或证书；平板连接 WiFi 后手工填写后端电脑当前主机 IP
      - 当前阶段不强制贴标后的二次复核扫码；扫码仍必须提交并校验 labelId，正确标签贴到错误包装的残余风险由客户接受
      - 系统核心业务不依赖互联网
      - 后端默认部署在 Windows 11
      - 平板默认适配最新 Android 系统
      - 安装包内置自动备份数据库
      - 用户正式密码具有隐私性，管理员不查看、不设置，只处理随机重置；初始密码只能一次性展示
      - 系统不采集、不保存、不展示身份证，普通操作员使用唯一工号进行人员识别
      - 管理员紧急恢复口令不得存放在前端或 Git 仓库；恢复接口必须限流、审计，并在成功后使旧登录令牌失效
      - 当前 HTTP 方案不对局域网传输加密；客户接受同一内部局域网内的明文传输风险
    quality_attributes:
      - 操作简单好上手，适合现场平板操作
      - 类型和重量防错规则明确，错误结果不得记录为成功
      - 扫码、拍照、称重、审批、打印和主数据修改均可追溯
      - 支持多台平板并发处理不同工单
      - 局域网离线可运行，不依赖外部服务
      - Excel 导入失败时给出错误行和原因，不静默覆盖有效数据
    assumptions:
      - text: 第一版不连接电子秤，重量以平板手动输入为主
        owner: 第一版范围
        invalidation_trigger: 用户要求第一版必须接入电子秤并能在现场完成硬件验证
      - text: 每次手动称重都必须拍摄可辨认的电子秤读数照片
        owner: 产品/现场
        invalidation_trigger: 客户允许不拍照或改为自动读秤后仍可验证重量
      - text: 自制二维码粘贴后扫码复核可以降低贴错标签风险
        owner: 产品/现场
        invalidation_trigger: 现场无法执行粘贴后复核
      - text: 第一版测试阶段允许一人平板申请、一人电脑审批
        owner: 产品
        invalidation_trigger: 客户要求真实生产版无码放行必须更高效
      - text: 平板先按 Android 安装包形态准备
        owner: 产品/技术
        invalidation_trigger: 客户实际平板是 iOS 或其它系统
      - text: 当前 Demo 只生成标签记录和二维码预览，真实标签打印机接入推迟到 Demo 验收后
        owner: 技术实施
        invalidation_trigger: 客户要求 Demo 必须打印实物标签，或 Demo 验收后重新定义打印流程
      - text: 长期保存第一版不设存储期限
        owner: 产品/现场
        invalidation_trigger: 客户提出归档或清理策略
    unresolved_questions:
      - id: TECH-LABEL-PRINTER
        summary: 真实打印机连接、型号、驱动、状态回传和贴标复核闭环推迟到 Demo 验收后
        blocking: false
        reason: 用户明确要求先完成第一版 Demo 给客户查看，再实施二维码与打印机连接
      - id: TECH-NETWORK-TRANSPORT
        summary: 公司内部 WiFi 下继续 HTTP 还是升级 HTTPS 尚未确认
        blocking: false
        reason: 已确认使用内部 WiFi，但尚需确认是否接受 HTTP 明文传输风险或投入 HTTPS 证书方案
      - id: TECH-TABLET-OS
        summary: 客户平板最终设备型号和 Android 版本未确认
        blocking: false
        reason: 暂按 Android 安装包交付
      - id: FUTURE-NOCODE-APPROVAL
        summary: 真实生产版无码辅料放行策略未定义
        blocking: false
        reason: 第一版测试版采用先审批后称重
