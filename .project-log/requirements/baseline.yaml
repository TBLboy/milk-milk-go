version: "0.3"
baselines:
  - id: REQ-001
    revision: 15
    status: active
    goal: 第一版交付一个独立运行的辅料称重防错系统，通过公司自制二维码确认辅料类型、通过手动输入重量并保存电子秤读数照片确认重量，并保存操作证据，防止生产过程中拿错辅料或称错重量。
    actors:
      - 平板端普通操作员：登录、创建和操作工单、扫码/拍照确认辅料、称重并提交记录
      - 平板端管理员：除操作员外，可录入和维护辅料、产品配方等主数据
      - 电脑后台管理员：审批工单和放行申请、创建分配工单、维护主数据、生成和管理标签、管理账号和参数
      - 电脑端审批人：第一版测试时审批无码辅料放行申请
    in_scope:
      - 独立系统，不连接金蝶；电脑后端和数据库 + 平板 App 通过局域网协同
      - 产品、配方和辅料主数据由用户在系统内维护，支持后台手工录入和 Excel 模板导入/导出
      - 辅料信息包含中文名称、选填英文名称、公司内部代号、默认保质期和多张包装图片；电脑和平板均可录入，仅管理员可操作；辅料不设置启用/停用状态
      - 产品配方包含产品名称、可选产品图片和各辅料每吨用量；一个产品只允许一个当前配方；配方发生影响生产配料的修改时保留不可变历史版本；只能从现有辅料库选择辅料，缺少辅料时先补录辅料
      - 后台生成自制二维码标签：选择辅料和数量，系统记录打印时间 printedAt、生成独立 labelId 并提供二维码预览；真实打印机接入推迟到第一版 Demo 验收通过后
      - 辅料类型确认以本系统自制二维码中的 materialId 与工单要求匹配为主；无码、标签异常走拍照申请审批
      - 类型确认统一采用“拍照扫码”：应用内相机现场拍摄后，从同一张照片解析二维码，并将带操作水印的照片作为类型确认证据；未识别到二维码时沿用照片申请审批
      - 第一版测试版无码辅料采用先审批后称重；全部证据留痕
      - 第一版称重结果由操作员在平板手动输入并标记为手动读数，同时必须拍摄并保存电子秤读数照片；数字重量和读数照片一起作为称重证据；不集成电子秤硬件，后续版本再研究自动读秤
      - 类型确认、重量确认及其他生产步骤需要上传的证据照片只能通过应用内相机现场拍摄，不允许从系统相册选择；照片自动添加操作员、拍摄时间、工单和步骤/辅料水印
      - 称重允差按辅料/配方配置，参数可在设置界面调整
      - 工单绑定操作员账号，支持创建、后台审批、接管审批、按顺序完成、撤销但保留历史记录
      - 账号区分为普通操作员和管理员；平板注册账号为普通账号，管理员账号由后台预置或创建
      - 用户账号资料包含头像、显示名、电话和工号；系统不采集或保存身份证；头像作为后台资料跨平板同步；普通用户可维护自己的头像、显示名和电话，工号仅可查看；管理员可维护普通用户资料；普通操作员工号必填且唯一，管理员账号工号可选
      - 平板注册账号使用注册人输入的密码，但注册申请需后台审批；审批通过前不能登录，审批通过后使用原密码登录
      - 管理员只可把普通账号密码重置为系统随机生成的一次性初始密码；初始密码弹窗一次性展示并支持复制，关闭后不可再次查看；用户首次登录必须修改密码
      - 用户可在平板用户资料中凭当前密码自助修改密码，无需管理员审批；重置后的初始密码首次登录必须修改才能继续业务操作
      - PC 登录页提供管理员紧急恢复入口；恢复口令仅在后端以哈希形式校验，成功后生成一次性临时密码、强制首次改密并使旧管理员令牌失效
      - 电脑端和平板端提供 BUG 反馈入口，登录用户可填写问题描述并可选上传多张图片；后端固定发送到 1218740205@qq.com，并保留发送状态和审计记录
      - 工单、扫码/图片、称重、审批和标签打印记录长期保存，不物理删除
      - 后端部署在现场可用电脑，平板与后端同一 WiFi 局域网访问，不依赖互联网
      - 架构输入已确认：称重按净重以 kg 输入；电子秤读数照片需同时包含材料和读数；允差默认取目标重量 1% 和 5g 中的较大值且可配置；工单创建时保存配方快照；工单允许暂停续作；Excel 导入采用新增和校验，不静默覆盖；无码放行审批人为电脑管理员；平板注册账号为普通操作员；第一版不提供平板离线队列；后端默认 Windows 11；平板按最新 Android 适配；平板和 Windows 均支持安装应用；安装包内置自动备份数据库
    out_of_scope:
      - 金蝶或其它 ERP 对接
      - 供应商原二维码/条形码解析和映射
      - 后端模型自动识别辅料包装图片
      - 真实生产阶段的无码放行策略
      - 实际生产日期、批次、有效期和到期日期管理
      - 库存、采购、财务、生产调度
      - 物理删除记录
      - 扫码枪作为第一版主流程
      - 真实标签打印机连接、驱动/SDK、RAW 指令、状态回传、重打和作废闭环（第一版 Demo 验收后实施）
      - 电子秤硬件、串口协议和实时读取
      - 平板断网后离线操作和自动同步
      - 当前版本的 HTTPS、内部 CA、证书分发、证书续期和固定 IP 要求
