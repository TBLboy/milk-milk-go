      - BL-WEIGH-001
      - BL-WEIGH-002
      - BL-RECOG-001
      - BL-LABEL-001
      - BL-LABEL-002
      - BL-WEIGH-003
      - BL-WEIGH-004
      - BL-WEIGH-005
      - BL-SETTINGS-001
      - BL-WEIGH-006
      - BL-WO-001
      - BL-WO-002
      - BL-WO-003
      - BL-WO-004
      - BL-WO-005
      - BL-WO-006
      - BL-AUTH-001
      - BL-SCOPE-001
      - BL-DATA-001
      - BL-DATA-002
      - BL-DATA-003
      - BL-DATA-004
      - BL-DEVICE-001
      - BL-DEVICE-002
    constraints:
      - 独立系统且不连接金蝶
      - 平板是现场首选操作设备，扫码枪不作为第一版阻塞项
      - 第一版识别以公司自制二维码为主，materialId 是核心匹配字段
      - 产品配方按每吨辅料用量录入并等比换算
      - 无码或标签异常先审批后称重
      - 称重允差放在设置界面，允许用户调整；稳定参数留待后续电子秤接入时再启用
      - 第一版手动称重必须同时保存数字重量和电子秤读数照片
      - 工单必须按顺序完成全部辅料步骤，且证据完整
      - 撤销/删除后保留全部历史记录
      - 辅料和产品配方录入仅管理员可操作
      - 二维码标签日期以标签打印日期 printedAt 为准，不管理实际生产日期
      - 后端部署在现场电脑，平板与后端处于同一 WiFi/局域网
      - 系统核心业务不依赖互联网
      - 后端默认部署在 Windows 11
      - 平板默认适配最新 Android 系统
      - 安装包内置自动备份数据库
    quality_attributes:
      - 操作简单好上手，适合现场平板操作
      - 类型和重量防错规则明确，错误结果不得记录为成功
      - 扫码、拍照、称重、审批、打印和主数据修改均可追溯
      - 支持多台平板并发处理不同工单
      - 局域网离线可运行，不依赖外部服务
      - Excel 导入失败时给出错误行和原因，不静默覆盖有效数据
    assumptions:
      - text: 第一版不连接电子秤，重量以平板手动输入为主
        owner: 第一版范围
        invalidation_trigger: 用户要求第一版必须接入电子秤并能在现场完成硬件验证
      - text: 每次手动称重都必须拍摄可辨认的电子秤读数照片
        owner: 产品/现场
        invalidation_trigger: 客户允许不拍照或改为自动读秤后仍可验证重量
      - text: 自制二维码粘贴后扫码复核可以降低贴错标签风险
        owner: 产品/现场
        invalidation_trigger: 现场无法执行粘贴后复核
      - text: 第一版测试阶段允许一人平板申请、一人电脑审批
        owner: 产品
        invalidation_trigger: 客户要求真实生产版无码放行必须更高效
      - text: 平板先按 Android 安装包形态准备
        owner: 产品/技术
        invalidation_trigger: 客户实际平板是 iOS 或其它系统
      - text: 标签打印机型号延后选型，不影响业务主流程
        owner: 技术实施
        invalidation_trigger: 打印机驱动/指令集成需要修改打印业务流程
      - text: 长期保存第一版不设存储期限
        owner: 产品/现场
        invalidation_trigger: 客户提出归档或清理策略
    unresolved_questions:
      - id: TECH-LABEL-PRINTER
        summary: 标签打印机品牌、型号、驱动或指令接口未选定
        blocking: false
        reason: 打印业务流程已确认，打印机硬件选型延后
      - id: TECH-TABLET-OS
        summary: 客户平板最终设备型号和 Android 版本未确认
        blocking: false
        reason: 暂按 Android 安装包交付
      - id: FUTURE-NOCODE-APPROVAL
        summary: 真实生产版无码辅料放行策略未定义
        blocking: false
        reason: 第一版测试版采用先审批后称重
